---
# Classic always provisions 3 control-plane nodes.
# There is no “single-node” option for Classic.
# If you want a 1-node data plane, use ROSA Hosted Control Plane (HCP) and a single-replica node pool.

- name: "Provision ROSA (Classic by default; HCP when requested)"
  hosts: localhost
  connection: local
  gather_facts: false

  environment:
    AWS_REGION: "{{ aws_region }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
    AWS_PAGER: ""

  vars:
    # ===== Cluster mode / naming =====
    hosted_control_plane: false
    aws_region: "us-east-1"
    cluster_name: "rosa-demo-classic"
    aws_ec2_ocp_srv_name: "openshift"

    # ===== OpenShift version =====
    openshift_version: ""

    # ===== Topology / sizing =====
    multi_az: false
    private: false
    compute_machine_type: "m5.xlarge"
    compute_replicas: 2
    availability_zones: []

    # ===== Tagging =====
    tags: "owner=iam,env=dev"

    # ===== Network =====
    subnet_ids: []
    create_vpc: false
    vpc_stack_name: "rosa-vpc-{{ cluster_name }}"

    # ===== Role/link options =====
    role_prefix: "ManagedOpenShift"
    operator_roles_prefix: "ManagedOpenShift"
    ocm_role_arn_to_link: ""
    force_policy_creation: false

    # ===== EE secrets path =====
    ee_secrets_dir: "/tmp/secrets"

    # ===== Auth files inside the EE =====
    token_file: "{{ ee_secrets_dir }}/ocm_offline_token.txt"
    aws_auth_from_file: true
    aws_credentials_file: "{{ ee_secrets_dir }}/aws_credentials.txt"
    aws_profile: ""

    # Optional helper file mirrored into .aws dirs
    aws_profile_txt_src: "{{ ee_secrets_dir }}/aws-profile.txt"
    tmp_aws_dir: "/tmp/.aws"
    tmp_profile_txt_dest: "{{ tmp_aws_dir }}/aws-profile.txt"

    # ===== Where the EE writes generated AWS CLI config/credentials =====
    aws_cli_home: "{{ ee_secrets_dir }}/awscli-{{ cluster_name }}"
    aws_credentials_out: "{{ aws_cli_home }}/credentials"
    aws_config_out: "{{ aws_cli_home }}/config"
    aws_output: "json"

    using_ansible_navigator: false
    runner_aws_dir: "/runner/.aws"
    runner_credentials_out: "{{ runner_aws_dir }}/credentials"
    runner_config_out: "{{ runner_aws_dir }}/config"
    runner_profile_txt_dest: "{{ runner_aws_dir }}/aws-profile.txt"

    workdir: "./artifacts/{{ cluster_name }}"
    admin_creds_file: "{{ ee_secrets_dir }}/cluster-admin-{{ cluster_name }}.txt"
    kubeconfig_path: "{{ ee_secrets_dir }}/kubeconfig-{{ cluster_name }}"

    # Waits
    cluster_ready_timeout_m: 150
    wait_poll_seconds: 60
    logs_tail: 200
    logs_poll_seconds: 20

    print_admin_creds: true

    # Binaries
    rosa_bin: "rosa"
    aws_bin: "aws"
    oc_bin: "oc"
    jq_bin: "jq"

  pre_tasks:
    - name: "Create artifacts directory for non-secret logs/outputs"
      ansible.builtin.file:
        path: "{{ workdir }}"
        state: directory
        mode: "0750"
      tags: [always, setup]

    - name: "Verify required CLIs are installed"
      vars:
        cli_list:
          - "{{ rosa_bin }}"
          - "{{ aws_bin }}"
          - "{{ oc_bin }}"
          - "{{ jq_bin }}"
      block:
        - name: "Check each CLI exists using command -v"
          ansible.builtin.shell: "command -v {{ item }}"
          args:
            executable: /bin/sh
          loop: "{{ cli_list }}"
          register: cli_check
          changed_when: false
          check_mode: false

        - name: "Fail if any CLI is missing"
          ansible.builtin.assert:
            that:
              - cli_check.results | map(attribute='rc') | list | max == 0
            fail_msg: "Missing required CLI: rosa/aws/oc/jq. Check the EE image PATH and binaries."
      tags: [always, setup]

    - name: "Show EE secrets directory contents when verbose"
      when: (ansible_verbosity | int) > 0
      ansible.builtin.command: "ls -la {{ ee_secrets_dir }}"
      register: ee_secrets_ls
      changed_when: false
      failed_when: false
      tags: [always, setup]

    - name: "Debug EE secrets directory contents when verbose"
      when: (ansible_verbosity | int) > 0
      ansible.builtin.debug:
        var: ee_secrets_ls.stdout_lines
      tags: [always, setup]

    # ------------------------- AWS CREDENTIALS SETUP -------------------------
    - name: "Stat AWS credentials file in EE secrets directory"
      when: aws_auth_from_file | bool
      ansible.builtin.stat:
        path: "{{ aws_credentials_file }}"
      register: aws_file_stat
      check_mode: false
      tags: [aws_auth]

    - name: "Read AWS credentials file content from EE secrets directory"
      when: aws_auth_from_file | bool and aws_file_stat.stat.exists
      ansible.builtin.set_fact:
        aws_file_content: "{{ lookup('file', aws_credentials_file) }}"
      tags: [aws_auth]

    - name: "Initialize AWS credential parse defaults"
      ansible.builtin.set_fact:
        _sections_list: "{{ _sections_list | default([]) }}"
        _env_profile_raw: "{{ _env_profile_raw | default('') }}"
        _env_aki: "{{ _env_aki | default('') }}"
        _env_sak: "{{ _env_sak | default('') }}"
        _env_tok: "{{ _env_tok | default('') }}"
        _ini_aki: "{{ _ini_aki | default('') }}"
        _ini_sak: "{{ _ini_sak | default('') }}"
        _ini_tok: "{{ _ini_tok | default('') }}"
      tags: [aws_auth]

    - name: "Discover sections and ENV AWS_PROFILE if present"
      when: aws_file_content is defined
      ansible.builtin.set_fact:
        _sections_list: "{{ aws_file_content | regex_findall('(?m)^\\s*\\[([^\\]]+)\\]\\s*$') }}"
        _env_profile_raw: "{{ (aws_file_content | regex_findall('(?mi)^\\s*AWS_PROFILE\\s*=\\s*(.+)$') | first | default('')) | trim }}"
      tags: [aws_auth]

    - name: "Sanitize provided and discovered profiles"
      ansible.builtin.set_fact:
        _aws_profile_arg: "{{ (aws_profile | default('') | string | trim) }}"
        _env_profile_clean: >-
          {{
            ''
            if ((_env_profile_raw | default('') | string | trim | lower) in ['none', 'null'])
            else (_env_profile_raw | default('') | string | trim)
          }}
        _first_section: "{{ (_sections_list | default([])) | first | default('') }}"
      tags: [aws_auth]

    - name: "Choose effective AWS profile"
      ansible.builtin.set_fact:
        effective_aws_profile: >-
          {{
            _aws_profile_arg
            if (_aws_profile_arg | length > 0)
            else (
              _env_profile_clean
              if (_env_profile_clean | length > 0)
              else (
                _first_section
                if (_first_section | length > 0)
                else 'default'
              )
            )
          }}
      tags: [aws_auth]

    - name: "Parse ENV-style credentials candidate"
      when: aws_file_content is defined
      ansible.builtin.set_fact:
        _env_aki: "{{ (aws_file_content | regex_findall('(?mi)^\\s*AWS_ACCESS_KEY_ID\\s*=\\s*(.+)$') | first | default('')) | trim }}"
        _env_sak: "{{ (aws_file_content | regex_findall('(?mi)^\\s*AWS_SECRET_ACCESS_KEY\\s*=\\s*(.+)$') | first | default('')) | trim }}"
        _env_tok: "{{ (aws_file_content | regex_findall('(?mi)^\\s*AWS_SESSION_TOKEN\\s*=\\s*(.+)$') | first | default('')) | trim }}"
      tags: [aws_auth]

    - name: "Parse INI-style credentials candidate from chosen profile"
      when: aws_file_content is defined
      vars:
        _sec: "{{ effective_aws_profile }}"
      ansible.builtin.set_fact:
        _ini_aki: "{{ (lookup('ini', 'aws_access_key_id section=' ~ _sec ~ ' file=' ~ aws_credentials_file, errors='ignore') | default('')) | trim }}"
        _ini_sak: "{{ (lookup('ini', 'aws_secret_access_key section=' ~ _sec ~ ' file=' ~ aws_credentials_file, errors='ignore') | default('')) | trim }}"
        _ini_tok: "{{ (lookup('ini', 'aws_session_token section=' ~ _sec ~ ' file=' ~ aws_credentials_file, errors='ignore') | default('')) | trim }}"
      tags: [aws_auth]

    - name: "Select final AWS creds prefer INI over ENV"
      ansible.builtin.set_fact:
        aws_access_key_id: >-
          {{
            ((_ini_aki | default('')) if ((_ini_aki | default('')) | length > 0) else (_env_aki | default('')))
            | string | trim
          }}
        aws_secret_access_key: >-
          {{
            ((_ini_sak | default('')) if ((_ini_sak | default('')) | length > 0) else (_env_sak | default('')))
            | string | trim
          }}
        aws_session_token: >-
          {{
            ((_ini_tok | default('')) if ((_ini_tok | default('')) | length > 0) else (_env_tok | default('')))
            | string | trim
          }}
      tags: [aws_auth]

    - name: "Normalize none/null to empty values"
      ansible.builtin.set_fact:
        aws_access_key_id: "{{ '' if (aws_access_key_id | default('') | string | lower) in ['none','null',''] else aws_access_key_id }}"
        aws_secret_access_key: "{{ '' if (aws_secret_access_key | default('') | string | lower) in ['none','null',''] else aws_secret_access_key }}"
        aws_session_token: "{{ '' if (aws_session_token | default('') | string | lower) in ['none','null'] else aws_session_token }}"
      tags: [aws_auth]

    - name: "Debug parsed credentials masked"
      when: (ansible_verbosity | int) > 0
      ansible.builtin.debug:
        msg:
          - "AWS credentials file: {{ aws_credentials_file }}"
          - "Effective profile: {{ effective_aws_profile }}"
          - "Key present: {{ 'yes' if (aws_access_key_id | length > 0) else 'no' }}"
          - "Secret present: {{ 'yes' if (aws_secret_access_key | length > 0) else 'no' }}"
          - "Token present: {{ 'yes' if (aws_session_token | length > 0) else 'no' }}"
          - "INI sections found: {{ _sections_list | default([]) }}"
      tags: [aws_auth]

    - name: "Assert AWS keys present when aws_auth_from_file is true"
      when: aws_auth_from_file | bool
      ansible.builtin.assert:
        that:
          - aws_file_stat.stat.exists
          - aws_access_key_id | length > 0
          - aws_secret_access_key | length > 0
        fail_msg: >-
          aws_auth_from_file=true but {{ aws_credentials_file }} was missing or did not contain usable keys.
          Your EE currently has secrets under {{ ee_secrets_dir }}. Supported formats:
          INI: [{{ effective_aws_profile }}] aws_access_key_id=... aws_secret_access_key=...
          ENV: AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=...
      tags: [aws_auth]

    - name: "Create AWS CLI home directory"
      ansible.builtin.file:
        path: "{{ aws_cli_home }}"
        state: directory
        mode: "0700"
      tags: [aws_auth]

    - name: "Materialize AWS config and credentials via aws configure set"
      ansible.builtin.shell: |
        set -euo pipefail
        export AWS_CONFIG_FILE="{{ aws_config_out }}"
        export AWS_SHARED_CREDENTIALS_FILE="{{ aws_credentials_out }}"
        mkdir -p "$(dirname "$AWS_CONFIG_FILE")"
        mkdir -p "$(dirname "$AWS_SHARED_CREDENTIALS_FILE")"
        {{ aws_bin }} configure set region "{{ aws_region }}" --profile "{{ effective_aws_profile }}"
        {{ aws_bin }} configure set output "{{ aws_output }}" --profile "{{ effective_aws_profile }}"
        {{ aws_bin }} configure set aws_access_key_id "{{ aws_access_key_id }}" --profile "{{ effective_aws_profile }}"
        {{ aws_bin }} configure set aws_secret_access_key "{{ aws_secret_access_key }}" --profile "{{ effective_aws_profile }}"
        {% if aws_session_token | length > 0 %}
        {{ aws_bin }} configure set aws_session_token "{{ aws_session_token }}" --profile "{{ effective_aws_profile }}"
        {% endif %}
      args:
        executable: /bin/bash
      changed_when: false
      tags: [aws_auth]

    - name: "Create /runner/.aws when using ansible-navigator"
      when: using_ansible_navigator | bool
      ansible.builtin.file:
        path: "{{ runner_aws_dir }}"
        state: directory
        mode: "0700"
      check_mode: false
      tags: [aws_auth]

    - name: "Create temporary .aws directory under /tmp"
      ansible.builtin.file:
        path: "{{ tmp_aws_dir }}"
        state: directory
        mode: "0700"
      check_mode: false
      tags: [aws_auth]

    - name: "Stat aws-profile.txt in EE secrets directory"
      ansible.builtin.stat:
        path: "{{ aws_profile_txt_src }}"
      register: aws_profile_txt_stat
      check_mode: false
      tags: [aws_auth]

    - name: "Copy aws-profile.txt into temporary .aws directory"
      when: aws_profile_txt_stat.stat.exists
      ansible.builtin.copy:
        src: "{{ aws_profile_txt_src }}"
        dest: "{{ tmp_profile_txt_dest }}"
        mode: "0600"
        remote_src: true
      tags: [aws_auth]

    - name: "Mirror credentials and config to /runner/.aws when using navigator"
      when: using_ansible_navigator | bool
      block:
        - name: "Mirror credentials to /runner/.aws/credentials"
          ansible.builtin.copy:
            dest: "{{ runner_credentials_out }}"
            mode: "0600"
            content: |-
              [{{ effective_aws_profile }}]
              aws_access_key_id={{ aws_access_key_id }}
              aws_secret_access_key={{ aws_secret_access_key }}{% if aws_session_token | length > 0 %}
              aws_session_token={{ aws_session_token }}{% endif %}

        - name: "Mirror config to /runner/.aws/config"
          ansible.builtin.copy:
            dest: "{{ runner_config_out }}"
            mode: "0600"
            content: |-
              [profile {{ effective_aws_profile }}]
              region = {{ aws_region }}
              output = {{ aws_output }}
      tags: [aws_auth]

    - name: "Initialize file-based AWS env"
      ansible.builtin.set_fact:
        aws_env_files:
          AWS_REGION: "{{ aws_region }}"
          AWS_DEFAULT_REGION: "{{ aws_region }}"
          AWS_PAGER: ""
          AWS_SHARED_CREDENTIALS_FILE: "{{ aws_credentials_out }}"
          AWS_CONFIG_FILE: "{{ aws_config_out }}"
          AWS_PROFILE: "{{ effective_aws_profile }}"
      tags: [aws_auth]

    - name: "Initialize direct AWS env if keys are present"
      ansible.builtin.set_fact:
        aws_env_direct: >-
          {{
            {
              'AWS_REGION': aws_region,
              'AWS_DEFAULT_REGION': aws_region,
              'AWS_PAGER': '',
              'AWS_ACCESS_KEY_ID': aws_access_key_id,
              'AWS_SECRET_ACCESS_KEY': aws_secret_access_key
            }
            | combine({'AWS_SESSION_TOKEN': aws_session_token}, recursive=True)
            if (aws_access_key_id | length > 0 and aws_secret_access_key | length > 0)
            else {}
          }}
      tags: [aws_auth]

    - name: "Initialize host AWS env fallback"
      ansible.builtin.set_fact:
        aws_env_host:
          AWS_REGION: "{{ aws_region }}"
          AWS_DEFAULT_REGION: "{{ aws_region }}"
          AWS_PAGER: ""
      tags: [aws_auth]

    - name: "Try AWS identity with direct env"
      when: not ansible_check_mode and (aws_env_direct | length > 0)
      ansible.builtin.command: "{{ aws_bin }} sts get-caller-identity"
      environment: "{{ aws_env_direct }}"
      register: aws_id_direct
      changed_when: false
      failed_when: false
      tags: [aws_auth]

    - name: "Try AWS identity with file env and explicit profile"
      when: not ansible_check_mode and ((aws_id_direct is not defined) or (aws_id_direct.rc != 0))
      ansible.builtin.command: "{{ aws_bin }} sts get-caller-identity --profile {{ effective_aws_profile }}"
      environment:
        AWS_SHARED_CREDENTIALS_FILE: "{{ aws_credentials_out }}"
        AWS_CONFIG_FILE: "{{ aws_config_out }}"
      register: aws_id_files
      changed_when: false
      failed_when: false
      tags: [aws_auth]

    - name: "Try AWS identity with host env fallback"
      when: >-
        not ansible_check_mode and
        ((aws_id_direct is defined) and (aws_id_direct.rc != 0)) and
        ((aws_id_files is defined) and (aws_id_files.rc != 0))
      ansible.builtin.command: "{{ aws_bin }} sts get-caller-identity"
      environment: "{{ aws_env_host }}"
      register: aws_id_host
      changed_when: false
      failed_when: false
      tags: [aws_auth]

    - name: "Select working AWS environment"
      when: not ansible_check_mode
      ansible.builtin.set_fact:
        aws_env: >-
          {{
            aws_env_direct
            if (aws_id_direct is defined and aws_id_direct.rc == 0)
            else (
              aws_env_files
              if (aws_id_files is defined and aws_id_files.rc == 0)
              else (
                aws_env_host
                if (aws_id_host is defined and aws_id_host.rc == 0)
                else omit
              )
            )
          }}
      tags: [aws_auth]

    - name: "Compute AWS auth attempt messages"
      when: not ansible_check_mode
      ansible.builtin.set_fact:
        _aws_err_direct: "{{ (aws_id_direct.stderr | default(aws_id_direct.stdout | default('n/a')) | string | trim) if (aws_id_direct is defined) else 'n/a' }}"
        _aws_err_files: "{{ (aws_id_files.stderr | default(aws_id_files.stdout | default('n/a')) | string | trim) if (aws_id_files is defined) else 'n/a' }}"
        _aws_err_host: "{{ (aws_id_host.stderr | default(aws_id_host.stdout | default('n/a')) | string | trim) if (aws_id_host is defined) else 'n/a' }}"
      tags: [aws_auth]

    - name: "Abort if no AWS auth method worked"
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - aws_env is defined
        fail_msg: |-
          No working AWS authentication method found.
          Tried DIRECT env, file-based ({{ aws_cli_home }} profile={{ effective_aws_profile }}), then host env.
          Last errors:
          DIRECT: {{ _aws_err_direct }}
          FILES: {{ _aws_err_files }}
          HOST:  {{ _aws_err_host }}
      tags: [aws_auth]

    # ------------------------- ROSA TOKEN LOGIN ------------------------------
    - name: "Check for offline token file in EE secrets directory"
      ansible.builtin.stat:
        path: "{{ token_file }}"
      register: token_stat
      check_mode: false
      tags: [rosa_auth]

    - name: "Load offline token from EE secrets directory"
      when: token_stat.stat.exists
      ansible.builtin.set_fact:
        ocm_token: "{{ lookup('file', token_file) | trim }}"
      tags: [rosa_auth]

    - name: "Fallback to OCM_TOKEN environment variable"
      when: not token_stat.stat.exists
      ansible.builtin.set_fact:
        ocm_token: "{{ lookup('env', 'OCM_TOKEN') | trim }}"
      tags: [rosa_auth]

    - name: "Assert a token is available for ROSA login"
      ansible.builtin.assert:
        that:
          - ocm_token is defined
          - ocm_token | length > 0
        fail_msg: >-
          OCM offline token not provided. Provide {{ token_file }} in the EE image or set OCM_TOKEN.
      tags: [rosa_auth]

    - name: "Login to ROSA/OCM using offline token"
      when: not ansible_check_mode
      ansible.builtin.shell: |
        set -euo pipefail
        {{ rosa_bin }} login --token="{{ ocm_token }}"
      args:
        executable: /bin/bash
      register: rosa_login
      changed_when: false
      no_log: false
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [rosa_auth]

  tasks:
    - name: "Compute minimum required compute replicas"
      ansible.builtin.set_fact:
        min_replicas_required: "{{ 3 if (multi_az | bool) else 2 }}"
      tags: [validate]

    - name: "Validate compute replica count"
      ansible.builtin.assert:
        that:
          - compute_replicas | int >= min_replicas_required | int
        fail_msg: >-
          compute_replicas={{ compute_replicas }} is invalid for this topology.
          Minimum required is {{ min_replicas_required }}.
      tags: [validate]

    - name: "Sanitize domain prefix"
      ansible.builtin.set_fact:
        domain_prefix: >-
          {{
            aws_ec2_ocp_srv_name
            | default('')
            | lower
            | regex_replace('[^a-z0-9-]', '-')
            | regex_replace('^-+', '')
            | regex_replace('-+$', '')
          }}
      tags: [create_cluster]

    - name: "Build base ROSA create command"
      ansible.builtin.set_fact:
        rosa_create_cmd: >-
          {{ rosa_bin }} create cluster
          --cluster-name {{ cluster_name }}
          --region {{ aws_region }}
          --compute-machine-type {{ compute_machine_type }}
          --compute-nodes {{ compute_replicas }}
          --role-arn {{ ocm_role_arn_to_link if (ocm_role_arn_to_link | length > 0) else '' }}
          --yes
      tags: [create_cluster]

    - name: "Append common ROSA create options"
      ansible.builtin.set_fact:
        rosa_create_cmd: >-
          {{ rosa_create_cmd }}
          {% if openshift_version | length > 0 %} --version {{ openshift_version }}{% endif %}
          {% if domain_prefix | length > 0 %} --domain-prefix {{ domain_prefix }}{% endif %}
          {% if multi_az | bool %} --multi-az{% endif %}
          {% if private | bool %} --private{% endif %}
          {% if tags | length > 0 %} --tags "{{ tags }}"{% endif %}
      tags: [create_cluster]

    - name: "Append subnet options if provided"
      when: subnet_ids | length > 0
      ansible.builtin.set_fact:
        rosa_create_cmd: >-
          {{ rosa_create_cmd }} --subnet-ids {{ subnet_ids | join(',') }}
      tags: [create_cluster]

    - name: "Append availability zone options if provided"
      when: availability_zones | length > 0
      ansible.builtin.set_fact:
        rosa_create_cmd: >-
          {{ rosa_create_cmd }} --availability-zones {{ availability_zones | join(',') }}
      tags: [create_cluster]

    - name: "Append HCP flag when requested"
      when: hosted_control_plane | bool
      ansible.builtin.set_fact:
        rosa_create_cmd: "{{ rosa_create_cmd }} --hosted-cp"
      tags: [create_cluster]

    - name: "Show ROSA create command"
      ansible.builtin.debug:
        msg: "{{ rosa_create_cmd }}"
      tags: [create_cluster]

    - name: "Check whether ROSA cluster already exists"
      when: not ansible_check_mode
      ansible.builtin.command: "{{ rosa_bin }} describe cluster -c {{ cluster_name }} -o json"
      register: existing_cluster
      changed_when: false
      failed_when: false
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [create_cluster]

    - name: "Create ROSA cluster"
      when: not ansible_check_mode and existing_cluster.rc != 0
      ansible.builtin.shell: |
        set -euo pipefail
        {{ rosa_create_cmd }}
      args:
        executable: /bin/bash
      register: create_cluster_out
      changed_when: true
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [create_cluster]

    - name: "Wait for ROSA cluster to be ready"
      when: not ansible_check_mode
      ansible.builtin.command: "{{ rosa_bin }} describe cluster -c {{ cluster_name }} -o json"
      register: cluster_desc_wait
      changed_when: false
      failed_when: false
      retries: "{{ ((cluster_ready_timeout_m | int) * 60 / (wait_poll_seconds | int)) | int }}"
      delay: "{{ wait_poll_seconds | int }}"
      until: >-
        cluster_desc_wait.rc == 0 and
        (cluster_desc_wait.stdout | default('') | length > 0) and
        ((cluster_desc_wait.stdout | from_json).state | default('') | lower == 'ready')
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [wait_ready]

    - name: "Final describe cluster for summary"
      when: not ansible_check_mode
      ansible.builtin.command: "{{ rosa_bin }} describe cluster -c {{ cluster_name }} -o json"
      register: cluster_desc
      changed_when: false
      failed_when: cluster_desc.rc != 0
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [wait_ready]

    - name: "Parse cluster JSON"
      when: not ansible_check_mode and (cluster_desc.stdout | default('') | length > 0)
      ansible.builtin.set_fact:
        cluster_json: "{{ cluster_desc.stdout | from_json }}"
        api_url: "{{ (cluster_desc.stdout | from_json).api.url | default('') }}"
      tags: [wait_ready]

    # ============================ Post-Install / HTPasswd login =============
    - name: "Create one-time cluster-admin user for initial access"
      when: not ansible_check_mode
      ansible.builtin.command: "{{ rosa_bin }} create admin -c {{ cluster_name }} --yes"
      register: create_admin
      changed_when: "'created' in (create_admin.stdout | lower) or 'generated' in (create_admin.stdout | lower)"
      failed_when: create_admin.rc not in [0]
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [admin_user]

    - name: "Save cluster-admin credentials to EE secrets directory"
      when: not ansible_check_mode and (create_admin is defined)
      ansible.builtin.copy:
        dest: "{{ admin_creds_file }}"
        mode: "0600"
        content: "{{ create_admin.stdout }}"
      tags: [admin_user]

    - name: "Extract cluster-admin password from output"
      when: not ansible_check_mode and (create_admin is defined)
      ansible.builtin.set_fact:
        cluster_admin_password: "{{ (create_admin.stdout | regex_search('(?mi)--password\\s+(\\S+)', '\\1') | default('')) }}"
      tags: [admin_user]

    - name: "Wait for HTPasswd IDP to appear"
      when: not ansible_check_mode
      ansible.builtin.command: "{{ rosa_bin }} list idps -c {{ cluster_name }} -o json"
      register: idps_json
      changed_when: false
      failed_when: false
      retries: 20
      delay: 15
      until: "(idps_json.stdout | default('') | lower) is search('htpasswd')"
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [admin_user]

    - name: "Attempt oc login with cluster-admin"
      when: not ansible_check_mode
      ansible.builtin.command: >-
        {{ oc_bin }} login {{ api_url }}
        --username cluster-admin
        --password {{ cluster_admin_password }}
        --insecure-skip-tls-verify=true
        --kubeconfig {{ kubeconfig_path }}
      register: oc_login_attempt
      changed_when: false
      failed_when: false
      retries: 20
      delay: 30
      until: oc_login_attempt.rc == 0
      tags: [admin_user]

    - name: "Verify login succeeded"
      when: not ansible_check_mode
      ansible.builtin.command: "{{ oc_bin }} whoami --kubeconfig {{ kubeconfig_path }}"
      register: whoami_out
      changed_when: false
      failed_when: whoami_out.rc != 0
      tags: [admin_user]

    - name: "Final summary"
      ansible.builtin.debug:
        msg:
          - "Mode: {{ 'Hosted Control Plane (HCP)' if hosted_control_plane else 'Classic (non-HCP)' }}"
          - "AZ topology: {{ 'multi-AZ' if multi_az else 'single-AZ' }}"
          - "Replicas: {{ compute_replicas }} (min required: {{ min_replicas_required }})"
          - "AWS credentials source: {{ aws_credentials_file }}"
          - "AWS generated config: {{ aws_config_out }}"
          - "AWS generated credentials: {{ aws_credentials_out }}"
          - "OCM token source: {{ token_file }}"
          - >-
            {% if ansible_check_mode -%}
            --check mode: identity/readiness/admin steps skipped.
            {%- else -%}
            {% if api_url is defined and api_url | length > 0 %}API: {{ api_url }}{% else %}API URL not parsed.{% endif %}
            {% if domain_prefix | default('') | length > 0 %}Domain prefix: {{ domain_prefix }}{% endif %}
            Kubeconfig: {{ kubeconfig_path }}
            Admin creds file (sensitive): {{ admin_creds_file }}
            {%- endif %}
      tags: [summary]
