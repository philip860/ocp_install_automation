---
- name: "Provision ROSA (Classic by default; HCP when requested)"
  hosts: localhost
  connection: local
  gather_facts: false

  environment:
    AWS_REGION: "{{ aws_region }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
    AWS_PAGER: ""

  vars:
    hosted_control_plane: false
    aws_region: "us-east-1"
    cluster_name: "rosa-demo-classic"

    openshift_version: ""

    multi_az: true
    private: false
    compute_machine_type: "m5.xlarge"
    compute_replicas: 3
    availability_zones: []

    tags: "owner=iam,env=dev"

    subnet_ids: []
    create_vpc: false
    vpc_stack_name: "rosa-vpc-{{ cluster_name }}"

    ocm_role_arn_to_link: ""

    token_file: "/tmp/ocm_offline_token.txt"
    aws_auth_from_file: true
    aws_credentials_file: "/tmp/aws_credentials.txt"
    use_aws_profile: false
    aws_profile: ""

    # Optional helper file to mirror into .aws dirs
    aws_profile_txt_src: "/tmp/aws-profile.txt"
    tmp_aws_dir: "/tmp/.aws"
    tmp_profile_txt_dest: "{{ tmp_aws_dir }}/aws-profile.txt"

    aws_cli_home: "/tmp/awscli-{{ cluster_name }}"
    aws_credentials_out: "{{ aws_cli_home }}/credentials"
    aws_config_out: "{{ aws_cli_home }}/config"
    aws_output: "json"

    using_ansible_navigator: false
    runner_aws_dir: "/runner/.aws"
    runner_credentials_out: "{{ runner_aws_dir }}/credentials"
    runner_config_out: "{{ runner_aws_dir }}/config"
    runner_profile_txt_dest: "{{ runner_aws_dir }}/aws-profile.txt"

    workdir: "./artifacts/{{ cluster_name }}"
    admin_creds_file: "/tmp/cluster-admin-{{ cluster_name }}.txt"

    cluster_ready_timeout_m: 150
    wait_poll_seconds: 60
    logs_tail: 200
    logs_poll_seconds: 20

    print_admin_creds: true

    rosa_bin: "rosa"
    aws_bin: "aws"
    oc_bin: "oc"
    jq_bin: "jq"

  pre_tasks:
    - name: "Create artifacts directory (for non-secret logs/outputs)"
      ansible.builtin.file:
        path: "{{ workdir }}"
        state: directory
        mode: "0750"
      tags: [always, setup]

    - name: "Verify required CLIs are installed"
      block:
        - name: "which (rosa/aws/oc/jq)"
          ansible.builtin.command: "which {{ item }}"
          loop:
            - "{{ rosa_bin }}"
            - "{{ aws_bin }}"
            - "{{ oc_bin }}"
            - "{{ jq_bin }}"
          register: which_out
          changed_when: false
          check_mode: no
        - name: "Fail if any CLI is missing"
          ansible.builtin.assert:
            that: "{{ which_out.results | map(attribute='rc') | list | max == 0 }}"
            fail_msg: "Missing required CLI (rosa/aws/oc/jq) on control host."
      tags: [always, setup]

    # ------------------------- AWS CREDENTIALS SETUP -------------------------
    - name: "Stat AWS credentials file in /tmp (if enabled)"
      when: aws_auth_from_file | bool
      ansible.builtin.stat:
        path: "{{ aws_credentials_file }}"
      register: aws_file_stat
      check_mode: no
      tags: [aws_auth]

    - name: "Read AWS credentials file content from /tmp"
      when: aws_auth_from_file | bool and aws_file_stat.stat.exists
      ansible.builtin.set_fact:
        aws_file_content: "{{ lookup('file', aws_credentials_file) }}"
      tags: [aws_auth]

    - name: "Parse AWS_ACCESS_KEY_ID from /tmp file (if present)"
      when: aws_file_content is defined
      ansible.builtin.set_fact:
        aws_access_key_id: "{{ (aws_file_content | regex_search('(?m)^AWS_ACCESS_KEY_ID=(.+)$', '\\1')) | default('') | trim }}"
      tags: [aws_auth]

    - name: "Parse AWS_SECRET_ACCESS_KEY from /tmp file (if present)"
      when: aws_file_content is defined
      ansible.builtin.set_fact:
        aws_secret_access_key: "{{ (aws_file_content | regex_search('(?m)^AWS_SECRET_ACCESS_KEY=(.+)$', '\\1')) | default('') | trim }}"
      tags: [aws_auth]

    - name: "Parse AWS_SESSION_TOKEN from /tmp file (if present, optional)"
      when: aws_file_content is defined
      ansible.builtin.set_fact:
        aws_session_token: "{{ (aws_file_content | regex_search('(?m)^AWS_SESSION_TOKEN=(.+)$', '\\1')) | default('') | trim }}"
      tags: [aws_auth]

    - name: "Parse AWS_PROFILE from /tmp file (if present, optional)"
      when: aws_file_content is defined
      ansible.builtin.set_fact:
        aws_profile_from_file: "{{ (aws_file_content | regex_search('(?m)^AWS_PROFILE=(.+)$', '\\1')) | default('') | trim }}"
      tags: [aws_auth]

    # Normalize profile (avoid 'None'/'null')
    - name: "Normalize profile inputs (strip 'None'/'null') - gather raw"
      ansible.builtin.set_fact:
        _aws_profile_raw: "{{ (aws_profile | default('') | string | trim) }}"
        _aws_profile_file_raw: "{{ (aws_profile_from_file | default('') | string | trim) }}"
      tags: [aws_auth]

    - name: "Normalize profile inputs (strip 'None'/'null') - compute cleaned"
      ansible.builtin.set_fact:
        aws_profile_clean: "{{ '' if (_aws_profile_raw | lower) in ['none','null'] else _aws_profile_raw }}"
        aws_profile_from_file_clean: "{{ '' if (_aws_profile_file_raw | lower) in ['none','null'] else _aws_profile_file_raw }}"
      tags: [aws_auth]

    - name: "Decide effective AWS profile (precedence: aws_profile > file > default)"
      ansible.builtin.set_fact:
        effective_aws_profile: >-
          {{
            (aws_profile_clean if (aws_profile_clean | length > 0)
             else (aws_profile_from_file_clean if (aws_profile_from_file_clean | length > 0)
             else 'default'))
          }}
      tags: [aws_auth]

    # Create isolated AWS CLI home under /tmp and populate credentials/config if keys exist
    - name: "Create /tmp AWS CLI home directory"
      ansible.builtin.file:
        path: "{{ aws_cli_home }}"
        state: directory
        mode: "0700"
      tags: [aws_auth]

    - name: "Write AWS credentials file (from keys in /tmp)"
      when:
        - aws_access_key_id | default('') | length > 0
        - aws_secret_access_key | default('') | length > 0
      ansible.builtin.copy:
        dest: "{{ aws_credentials_out }}"
        mode: "0600"
        content: |-
          [{{ effective_aws_profile }}]
          aws_access_key_id={{ aws_access_key_id }}
          aws_secret_access_key={{ aws_secret_access_key }}{% if aws_session_token | default('') | length > 0 %}
          aws_session_token={{ aws_session_token }}{% endif %}
      tags: [aws_auth]

    - name: "Write AWS config file (region/output)"
      ansible.builtin.copy:
        dest: "{{ aws_config_out }}"
        mode: "0600"
        content: |-
          [profile {{ effective_aws_profile }}]
          region = {{ aws_region }}
          output = {{ aws_output }}
      tags: [aws_auth]

    # --- Create mirror dirs with check_mode: no so copies won't fail in --check ---
    - name: "Create /runner/.aws when using_ansible_navigator"
      when: using_ansible_navigator | bool
      ansible.builtin.file:
        path: "{{ runner_aws_dir }}"
        state: directory
        mode: "0700"
      check_mode: no
      tags: [aws_auth]

    - name: "Create /tmp/.aws directory (0700)"
      ansible.builtin.file:
        path: "{{ tmp_aws_dir }}"
        state: directory
        mode: "0700"
      check_mode: no
      tags: [aws_auth]

    # --- Mirror credentials/config into /runner/.aws when requested ---
    - name: "Mirror credentials to /runner/.aws/credentials (if keys exist)"
      when:
        - using_ansible_navigator | bool
        - aws_access_key_id | default('') | length > 0
        - aws_secret_access_key | default('') | length > 0
      ansible.builtin.copy:
        dest: "{{ runner_credentials_out }}"
        mode: "0600"
        content: |-
          [{{ effective_aws_profile }}]
          aws_access_key_id={{ aws_access_key_id }}
          aws_secret_access_key={{ aws_secret_access_key }}{% if aws_session_token | default('') | length > 0 %}
          aws_session_token={{ aws_session_token }}{% endif %}
      tags: [aws_auth]

    - name: "Mirror config to /runner/.aws/config"
      when: using_ansible_navigator | bool
      ansible.builtin.copy:
        dest: "{{ runner_config_out }}"
        mode: "0600"
        content: |-
          [profile {{ effective_aws_profile }}]
          region = {{ aws_region }}
          output = {{ aws_output }}
      tags: [aws_auth]

    # --- Copy /tmp/aws-profile.txt into both .aws dirs when present ---
    - name: "Stat /tmp/aws-profile.txt"
      ansible.builtin.stat:
        path: "{{ aws_profile_txt_src }}"
      register: aws_profile_txt_stat
      check_mode: no
      tags: [aws_auth]

    - name: "Copy aws-profile.txt into /tmp/.aws/"
      when: aws_profile_txt_stat.stat.exists
      ansible.builtin.copy:
        src: "{{ aws_profile_txt_src }}"
        dest: "{{ tmp_profile_txt_dest }}"
        mode: "0600"
        remote_src: true
      tags: [aws_auth]

    - name: "Copy aws-profile.txt into /runner/.aws/ (navigator)"
      when: using_ansible_navigator | bool and aws_profile_txt_stat.stat.exists
      ansible.builtin.copy:
        src: "{{ aws_profile_txt_src }}"
        dest: "{{ runner_profile_txt_dest }}"
        mode: "0600"
        remote_src: true
      tags: [aws_auth]

    # Base env that always points at our /tmp files (explicit & highest precedence)
    - name: "Initialize base AWS env pointing to /tmp files"
      ansible.builtin.set_fact:
        aws_base_env:
          AWS_REGION: "{{ aws_region }}"
          AWS_DEFAULT_REGION: "{{ aws_region }}"
          AWS_PAGER: ""
          AWS_SHARED_CREDENTIALS_FILE: "{{ aws_credentials_out }}"
          AWS_CONFIG_FILE: "{{ aws_config_out }}"
      tags: [aws_auth]

    - name: "Add AWS_PROFILE to env only when valid"
      when: effective_aws_profile | length > 0
      ansible.builtin.set_fact:
        aws_base_env: "{{ aws_base_env | combine({'AWS_PROFILE': effective_aws_profile}, recursive=True) }}"
      tags: [aws_auth]

    - name: "Build candidate env: materialized /tmp credentials/profile"
      ansible.builtin.set_fact:
        aws_env_keys_or_profile: "{{ aws_base_env }}"
      tags: [aws_auth]

    - name: "Build candidate env: host environment (fallback)"
      ansible.builtin.set_fact:
        aws_env_host:
          AWS_REGION: "{{ aws_region }}"
          AWS_DEFAULT_REGION: "{{ aws_region }}"
          AWS_PAGER: ""
      tags: [aws_auth]

    - name: "Compute primary auth source and fallbacks (prefer /tmp materialized)"
      ansible.builtin.set_fact:
        aws_primary_env: "{{ aws_env_keys_or_profile }}"
        aws_primary_name: "tmp-files"
        aws_fallback1_env: "{{ aws_env_host }}"
        aws_fallback1_name: "host"
      tags: [aws_auth]

    - name: "Show selected AWS auth candidates (debug)"
      when: (ansible_verbosity | int) > 0
      ansible.builtin.debug:
        msg:
          - "Primary AWS auth: {{ aws_primary_name }} ({{ aws_credentials_out }}, {{ aws_config_out }}, profile={{ effective_aws_profile }})"
          - "Fallback1: {{ aws_fallback1_name }}"
          - "Navigator mirror: {{ 'on' if (using_ansible_navigator | bool) else 'off' }} -> {{ runner_aws_dir }}"
          - "aws-profile.txt present: {{ 'yes' if (aws_profile_txt_stat.stat.exists) else 'no' }}"
      tags: [aws_auth]

    # ------------------------- Verify AWS identity with fallback -------------
    - name: "Try AWS identity with PRIMARY env (/tmp materialized) (skipped in --check)"
      when: not ansible_check_mode
      ansible.builtin.command: "{{ aws_bin }} sts get-caller-identity"
      environment: "{{ aws_primary_env }}"
      register: aws_identity_primary
      changed_when: false
      failed_when: false
      tags: [aws_auth]

    - name: "Try AWS identity with FALLBACK1 env (host) if primary failed"
      when: not ansible_check_mode and (aws_identity_primary.rc != 0)
      ansible.builtin.command: "{{ aws_bin }} sts get-caller-identity"
      environment: "{{ aws_fallback1_env }}"
      register: aws_identity_fb1
      changed_when: false
      failed_when: false
      tags: [aws_auth]

    - name: "Pick the first successful AWS env (or none)"
      when: not ansible_check_mode
      ansible.builtin.set_fact:
        aws_env: >-
          {{
            (aws_primary_env if (aws_identity_primary.rc == 0)
             else (aws_fallback1_env if (aws_identity_fb1 is defined and aws_identity_fb1.rc == 0)
             else omit))
          }}
        aws_env_source: >-
          {{
            (aws_primary_name if (aws_identity_primary.rc == 0)
             else ('host' if (aws_identity_fb1 is defined and aws_identity_fb1.rc == 0)
             else 'none'))
          }}
      tags: [aws_auth]

    - name: "Abort if no AWS auth method worked (non-check mode)"
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - aws_env is defined
        fail_msg: >-
          No working AWS authentication method found.
          Tried (in order): {{ aws_primary_name }}, {{ aws_fallback1_name }}.
          Last error:
          {% if aws_identity_fb1 is defined %}
            {{ aws_identity_fb1.stderr | default(aws_identity_fb1.stdout) | trim }}
          {% else %}
            {{ aws_identity_primary.stderr | default(aws_identity_primary.stdout) | trim }}
          {% endif %}
      tags: [aws_auth]

    - name: "Confirm chosen AWS auth method (debug)"
      when: (ansible_verbosity | int) > 0 and not ansible_check_mode
      ansible.builtin.debug:
        msg:
          - "Using AWS auth source: {{ aws_env_source }}"
      tags: [aws_auth]

    # ------------------------- ROSA TOKEN LOGIN ------------------------------
    - name: "Check for offline token file in /tmp"
      ansible.builtin.stat:
        path: "{{ token_file }}"
      register: token_stat
      check_mode: no
      tags: [rosa_auth]

    - name: "Load offline token from /tmp (preferred)"
      when: token_stat.stat.exists
      ansible.builtin.set_fact:
        ocm_token: "{{ lookup('file', token_file) | trim }}"
      tags: [rosa_auth]

    - name: "Fallback to OCM_TOKEN environment variable"
      when: not token_stat.stat.exists
      ansible.builtin.set_fact:
        ocm_token: "{{ lookup('env', 'OCM_TOKEN') | trim }}"
      tags: [rosa_auth]

    - name: "Assert a token is available for ROSA login"
      ansible.builtin.assert:
        that:
          - ocm_token is defined
          - ocm_token | length > 0
        fail_msg: "No offline token found. Put it in {{ token_file }} or export OCM_TOKEN."
      tags: [rosa_auth]

    - name: "Log in to ROSA/OCM with offline token (non-interactive)"
      ansible.builtin.command: >
        {{ rosa_bin }} login --token "{{ ocm_token }}"
      environment: "{{ aws_env | default(aws_base_env) }}"
      register: rosa_login
      changed_when: "'Logged in' in rosa_login.stdout or rosa_login.rc == 0"
      check_mode: no
      tags: [rosa_auth]

    # ----------------------------- GUARDRAILS --------------------------------
    - name: "Compute minimum replicas required based on topology"
      ansible.builtin.set_fact:
        min_replicas_required: "{{ 3 if multi_az else 2 }}"
      tags: [guardrails]

    - name: "Enforce minimum replicas (fail fast with guidance)"
      ansible.builtin.assert:
        that:
          - (compute_replicas | int) >= (min_replicas_required | int)
        fail_msg: "Invalid 'compute_replicas' for topology; need >= {{ min_replicas_required }}."
      tags: [guardrails]

    - name: "Validate availability_zones count if provided"
      when: availability_zones | length > 0
      ansible.builtin.assert:
        that:
          - (availability_zones | length) >= 2 if multi_az else (availability_zones | length) == 1
        fail_msg: "availability_zones does not match topology."
      tags: [guardrails]

  tasks:
    # ===================== OCM/Account Prereqs (idempotent) =================
    - name: "Create OCM admin role if none exists (safe to re-run)"
      ansible.builtin.command: >
        {{ rosa_bin }} create ocm-role --admin
      register: create_ocm_admin_role
      changed_when: "'created' in (create_ocm_admin_role.stdout | lower)"
      failed_when: create_ocm_admin_role.rc not in [0]
      environment: "{{ aws_env | default(aws_base_env) }}"
      tags: [prereqs]

    - name: "Create user role (safe to re-run)"
      ansible.builtin.command: >
        {{ rosa_bin }} create user-role
      register: create_user_role
      changed_when: "'created' in (create_user_role.stdout | lower)"
      failed_when: create_user_role.rc not in [0]
      environment: "{{ aws_env | default(aws_base_env) }}"
      tags: [prereqs]

    - name: "Create account-wide roles and policies (auto mode; idempotent)"
      ansible.builtin.command: >
        {{ rosa_bin }} create account-roles --mode auto --yes --region {{ aws_region }}
      register: create_account_roles
      changed_when: "'created' in (create_account_roles.stdout | lower)"
      failed_when: create_account_roles.rc not in [0]
      environment: "{{ aws_env | default(aws_base_env) }}"
      tags: [prereqs]

    - name: "Optionally link an existing OCM role to your RH org"
      when: ocm_role_arn_to_link | length > 0
      ansible.builtin.command: >
        {{ rosa_bin }} link ocm-role {{ ocm_role_arn_to_link }}
      register: link_ocm_role
      changed_when: "'linked' in (link_ocm_role.stdout | lower)"
      failed_when: link_ocm_role.rc not in [0]
      environment: "{{ aws_env | default(aws_base_env) }}"
      tags: [prereqs]

    # ========================= Optional Network Creation =====================
    - name: "Conditionally create a VPC for the cluster"
      when: create_vpc | bool
      block:
        - name: "Create VPC via 'rosa create network' (idempotent)"
          ansible.builtin.command: >
            {{ rosa_bin }} create network
            --yes
            --region {{ aws_region }}
            --stack-name {{ vpc_stack_name }}
          register: rosa_network
          changed_when: "'created' in (rosa_network.stdout | lower)"
          failed_when: rosa_network.rc not in [0]
          environment: "{{ aws_env | default(aws_base_env) }}"
          tags: [network]

        - name: "Describe VPC to get subnet IDs"
          ansible.builtin.command: >
            {{ rosa_bin }} describe network --stack-name {{ vpc_stack_name }} -o json
          register: rosa_network_desc
          changed_when: false
          check_mode: no
          environment: "{{ aws_env | default(aws_base_env) }}"
          tags: [network]

        - name: "Save subnet_ids from network stack outputs"
          ansible.builtin.set_fact:
            subnet_ids: "{{ (rosa_network_desc.stdout | default('{}') | from_json).subnet_ids | default(subnet_ids) }}"
          tags: [network]

    # ============================ Cluster Creation ===========================
    - name: "Check if the cluster already exists"
      ansible.builtin.command: "{{ rosa_bin }} describe cluster -c {{ cluster_name }} -o json"
      register: existing_cluster
      changed_when: false
      failed_when: false
      check_mode: no
      environment: "{{ aws_env | default(aws_base_env) }}"
      tags: [cluster_create]

    - name: "Build base cluster create command (shared flags)"
      ansible.builtin.set_fact:
        _cluster_cmd_base: >-
          {{ rosa_bin }} create cluster
          --cluster-name {{ cluster_name }}
          --sts
          --mode auto
          --yes
          --region {{ aws_region }}
          --tags "{{ tags }}"
          --compute-machine-type {{ compute_machine_type }}
          --replicas {{ compute_replicas }}
          {% if private %} --private {% endif %}
          {% if multi_az %} --multi-az {% endif %}
          {% if availability_zones|length > 0 %} --availability-zones {{ availability_zones | join(',') }} {% endif %}
          {% if subnet_ids|length > 0 %} --subnet-ids {{ subnet_ids | join(',') }} {% endif %}
          {% if openshift_version|length > 0 %} --version {{ openshift_version }} {% endif %}
      tags: [cluster_create]

    - name: "Derive final cluster create command for selected mode"
      ansible.builtin.set_fact:
        create_cluster_cmd: >-
          {{ _cluster_cmd_base }}{% if hosted_control_plane %} --hosted-cp{% endif %}
      tags: [cluster_create]

    - name: "Create the cluster if it does not exist yet"
      when: existing_cluster.rc != 0
      ansible.builtin.command: "{{ create_cluster_cmd }}"
      register: create_cluster
      changed_when: true
      failed_when: create_cluster.rc not in [0]
      environment: "{{ aws_env | default(aws_base_env) }}"
      tags: [cluster_create]

    # =================== Cluster-Scoped IAM (idempotent safety) =============
    - name: "Ensure cluster operator-roles exist (auto)"
      ansible.builtin.command: >
        {{ rosa_bin }} create operator-roles -c {{ cluster_name }} --mode auto --yes
      register: create_operator_roles
      changed_when: "'created' in (create_operator_roles.stdout | lower)"
      failed_when: create_operator_roles.rc not in [0]
      environment: "{{ aws_env | default(aws_base_env) }}"
      tags: [operator_roles]

    - name: "Ensure cluster OIDC provider exists (auto)"
      ansible.builtin.command: >
        {{ rosa_bin }} create oidc-provider -c {{ cluster_name }} --mode auto --yes
      register: create_oidc_provider
      changed_when: "'created' in (create_oidc_provider.stdout | lower)"
      failed_when: create_oidc_provider.rc not in [0]
      environment: "{{ aws_env | default(aws_base_env) }}"
      tags: [oidc]

    # ============================ Wait for Ready =============================
    - name: "Compute waiter retries from timeout+interval"
      ansible.builtin.set_fact:
        wait_retries: "{{ ((cluster_ready_timeout_m | int) * 60 // (wait_poll_seconds | int)) | int }}"
      tags: [wait_ready]

    - name: "Watch install logs until cluster is ready (async)"
      when: not ansible_check_mode
      vars:
        watch_seconds: "{{ (cluster_ready_timeout_m | int) * 60 }}"
      ansible.builtin.command: >
        {{ rosa_bin }} logs install -c {{ cluster_name }} --watch --tail={{ logs_tail }}
      register: install_watch
      changed_when: false
      failed_when: false
      async: "{{ watch_seconds }}"
      poll: "{{ logs_poll_seconds }}"
      environment: "{{ aws_env | default(aws_base_env) }}"
      tags: [wait_ready]

    - name: "Wait until cluster state is 'ready'"
      when: not ansible_check_mode
      ansible.builtin.command: "{{ rosa_bin }} describe cluster -c {{ cluster_name }} -o json"
      register: cluster_desc_wait
      changed_when: false
      failed_when: false
      retries: "{{ wait_retries }}"
      delay: "{{ wait_poll_seconds }}"
      until: >
        (cluster_desc_wait.stdout is defined) and
        (cluster_desc_wait.stdout | length > 0) and
        ((cluster_desc_wait.stdout | from_json).state | lower == 'ready')
      environment: "{{ aws_env | default(aws_base_env) }}"
      tags: [wait_ready]

    - name: "Final describe (parse for summary)"
      when: not ansible_check_mode
      ansible.builtin.command: "{{ rosa_bin }} describe cluster -c {{ cluster_name }} -o json"
      register: cluster_desc
      changed_when: false
      failed_when: cluster_desc.rc != 0
      check_mode: no
      environment: "{{ aws_env | default(aws_base_env) }}"
      tags: [wait_ready]

    - name: "Parse cluster JSON (only when we have output)"
      when: not ansible_check_mode and (cluster_desc.stdout | default('') | length > 0)
      ansible.builtin.set_fact:
        cluster_json: "{{ cluster_desc.stdout | from_json }}"
      tags: [wait_ready]

    # ============================ Post-Install ===============================
    - name: "Create one-time cluster-admin user for initial access"
      when: not ansible_check_mode
      ansible.builtin.command: "{{ rosa_bin }} create admin -c {{ cluster_name }} --yes"
      register: create_admin
      changed_when: "'created' in (create_admin.stdout | lower) or 'generated' in (create_admin.stdout | lower)"
      failed_when: create_admin.rc not in [0]
      environment: "{{ aws_env | default(aws_base_env) }}"
      tags: [admin_user]

    - name: "Save cluster-admin credentials to /tmp (0600)"
      when: not ansible_check_mode and (create_admin is defined)
      ansible.builtin.copy:
        dest: "{{ admin_creds_file }}"
        mode: "0600"
        content: "{{ create_admin.stdout }}"
      tags: [admin_user]

    - name: "Stash admin credentials text for final summary"
      when: not ansible_check_mode and (create_admin is defined)
      ansible.builtin.set_fact:
        admin_creds_text: "{{ create_admin.stdout }}"
      tags: [admin_user]

    - name: "Extract API URL for convenience"
      when: not ansible_check_mode and (cluster_json is defined)
      ansible.builtin.set_fact:
        api_url: "{{ cluster_json.api.url }}"
      tags: [summary]

    - name: "Final summary"
      ansible.builtin.debug:
        msg:
          - "Mode: {{ 'Hosted Control Plane (HCP)' if hosted_control_plane else 'Classic (non-HCP)' }}"
          - "AZ topology: {{ 'multi-AZ' if multi_az else 'single-AZ' }}"
          - "Replicas: {{ compute_replicas }} (min required: {{ min_replicas_required }})"
          - >-
            {% if ansible_check_mode %}
            --check mode: identity/readiness/admin steps skipped.
            {% else %}
            {% if api_url is defined %}API: {{ api_url }}{% else %}API URL not parsed.{% endif %}
            Admin creds file (sensitive): {{ admin_creds_file }}
            {% if print_admin_creds and (admin_creds_text is defined) %}
            ---- Cluster Admin Credentials (sensitive) ----
            {{ admin_creds_text }}
            -----------------------------------------------
            {% endif %}
            {% endif %}
      tags: [summary]
