---
# Playbook: Install ROSA in Classic (default) or Hosted Control Plane (HCP) mode
# Secrets under /tmp:
#   - AWS credentials file: /tmp/aws_credentials.txt
#   - ROSA offline token:   /tmp/ocm_offline_token.txt
#   - Admin creds output:   /tmp/cluster-admin-<cluster_name>.txt
# Includes:
#   - AWS auth (file/profile/env), early AWS+ROSA login
#   - Guardrails for worker replicas
#   - Classic (default) vs HCP via flag
#   - Check-mode safety
#   - Final summary prints admin credentials to console

- name: Provision ROSA (Classic by default; HCP when requested)
  hosts: localhost
  connection: local
  gather_facts: false

  # Region env here; credentials added via aws_env later
  environment:
    AWS_REGION: "{{ aws_region }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
    AWS_PAGER: ""

  vars:
    ###########################################################################
    # ---------------------------- USER INPUTS --------------------------------
    ###########################################################################
    # ===== Cluster mode =====
    hosted_control_plane: false              # false = Classic (non-HCP); true = HCP

    # ===== Region / naming =====
    aws_region: "us-east-1"
    cluster_name: "rosa-demo-classic"

    # ===== OpenShift version =====
    openshift_version: ""                    # e.g., "4.16.18"; empty = latest stable

    # ===== Topology / sizing =====
    multi_az: true
    private: false
    compute_machine_type: "m5.xlarge"
    compute_replicas: 3
    availability_zones: []                   # e.g., ["us-east-1a","us-east-1b","us-east-1c"]

    # ===== Tagging =====
    tags: "owner=iam,env=dev"

    # ===== Network (existing or create via ROSA) =====
    subnet_ids: []
    create_vpc: false
    vpc_stack_name: "rosa-vpc-{{ cluster_name }}"

    # ===== OCM/ROSA role/link options =====
    ocm_role_arn_to_link: ""                 # set to link an existing OCM role; leave empty to skip

    # ===== ROSA auth (offline token) — from /tmp =====
    token_file: "/tmp/ocm_offline_token.txt"   # file contains ONLY the token, one line
    # If file missing, falls back to OCM_TOKEN env var.

    # ===== AWS auth options (priority: file > profile > host env) =====
    aws_auth_from_file: true
    aws_credentials_file: "/tmp/aws_credentials.txt"   # env-style lines (see notes below)
    use_aws_profile: false
    aws_profile: ""                                    # profile name if using profile

    # ===== Paths / tools / timeouts =====
    workdir: "./artifacts/{{ cluster_name }}"          # non-secret logs/outputs
    admin_creds_file: "/tmp/cluster-admin-{{ cluster_name }}.txt"   # sensitive -> /tmp
    cluster_ready_timeout_m: 90

    # Print admin creds to console in Final summary (set false to suppress)
    print_admin_creds: true

    # Binaries
    rosa_bin: "rosa"
    aws_bin: "aws"
    oc_bin: "oc"
    jq_bin: "jq"

  ###########################################################################
  # ---------------------------- PRE-TASKS ----------------------------------
  ###########################################################################
  pre_tasks:
    - name: Create artifacts directory (for non-secret logs/outputs)
      ansible.builtin.file:
        path: "{{ workdir }}"
        state: directory
        mode: "0750"

    - name: Verify required CLIs are installed
      block:
        - name: which (rosa/aws/oc/jq)
          ansible.builtin.command: "which {{ item }}"
          loop:
            - "{{ rosa_bin }}"
            - "{{ aws_bin }}"
            - "{{ oc_bin }}"
            - "{{ jq_bin }}"
          register: which_out
          changed_when: false
          check_mode: no
        - name: Fail if any CLI is missing
          ansible.builtin.assert:
            that: "{{ which_out.results | map(attribute='rc') | list | max == 0 }}"
            fail_msg: "Missing required CLI (rosa/aws/oc/jq) on control host."

    # ------------------------- AWS CREDENTIALS SETUP -------------------------
    - name: Stat AWS credentials file in /tmp (if enabled)
      when: aws_auth_from_file | bool
      ansible.builtin.stat:
        path: "{{ aws_credentials_file }}"
      register: aws_file_stat
      check_mode: no

    - name: Read AWS credentials file content from /tmp
      when: aws_auth_from_file | bool and aws_file_stat.stat.exists
      ansible.builtin.set_fact:
        aws_file_content: "{{ lookup('file', aws_credentials_file) }}"

    - name: Parse AWS_ACCESS_KEY_ID from /tmp file (if present)
      when: aws_file_content is defined
      ansible.builtin.set_fact:
        aws_access_key_id: "{{ (aws_file_content | regex_search('(?m)^AWS_ACCESS_KEY_ID=(.+)$', '\\1')) | default('') | trim }}"

    - name: Parse AWS_SECRET_ACCESS_KEY from /tmp file (if present)
      when: aws_file_content is defined
      ansible.builtin.set_fact:
        aws_secret_access_key: "{{ (aws_file_content | regex_search('(?m)^AWS_SECRET_ACCESS_KEY=(.+)$', '\\1')) | default('') | trim }}"

    - name: Parse AWS_SESSION_TOKEN from /tmp file (if present, optional)
      when: aws_file_content is defined
      ansible.builtin.set_fact:
        aws_session_token: "{{ (aws_file_content | regex_search('(?m)^AWS_SESSION_TOKEN=(.+)$', '\\1')) | default('') | trim }}"

    - name: Parse AWS_PROFILE from /tmp file (if present, optional)
      when: aws_file_content is defined
      ansible.builtin.set_fact:
        aws_profile_from_file: "{{ (aws_file_content | regex_search('(?m)^AWS_PROFILE=(.+)$', '\\1')) | default('') | trim }}"

    # Build aws_env in simple, sequential steps (no complex Jinja expressions)
    - name: Initialize aws_env with region/pager defaults
      ansible.builtin.set_fact:
        aws_env:
          AWS_REGION: "{{ aws_region }}"
          AWS_DEFAULT_REGION: "{{ aws_region }}"
          AWS_PAGER: ""

    - name: If file provided static keys, merge keys into aws_env
      when: (aws_auth_from_file | bool) and
            (aws_access_key_id | default('') | length > 0) and
            (aws_secret_access_key | default('') | length > 0)
      ansible.builtin.set_fact:
        aws_env: "{{ aws_env | combine({'AWS_ACCESS_KEY_ID': aws_access_key_id, 'AWS_SECRET_ACCESS_KEY': aws_secret_access_key}, recursive=True) }}"

    - name: If a session token exists, merge it into aws_env
      when: aws_session_token | default('') | length > 0
      ansible.builtin.set_fact:
        aws_env: "{{ aws_env | combine({'AWS_SESSION_TOKEN': aws_session_token}, recursive=True) }}"

    - name: "Decide effective AWS profile (vars precedence: aws_profile > file)"
      when: (use_aws_profile | bool) or (aws_profile | length > 0) or (aws_profile_from_file | default('') | length > 0)
      ansible.builtin.set_fact:
        effective_aws_profile: "{{ aws_profile if (aws_profile | length > 0) else (aws_profile_from_file | default('')) }}"

    - name: If using a profile and no static keys set, merge profile into aws_env
      when: (effective_aws_profile is defined) and
            (aws_env.AWS_ACCESS_KEY_ID is not defined) and
            (aws_env.AWS_SECRET_ACCESS_KEY is not defined)
      ansible.builtin.set_fact:
        aws_env: "{{ aws_env | combine({'AWS_PROFILE': effective_aws_profile}, recursive=True) }}"

    - name: Show selected AWS auth path (debug)
      when: (ansible_verbosity | int) > 0
      ansible.builtin.debug:
        msg:
          - >-
            AWS auth source: {{
              'file(/tmp/aws_credentials.txt)'
              if ('AWS_ACCESS_KEY_ID' in aws_env)
              else ('profile:' ~ aws_env.AWS_PROFILE if ('AWS_PROFILE' in aws_env) else 'host-env')
            }}

    - name: Verify AWS identity (skipped in --check)
      when: not ansible_check_mode
      ansible.builtin.command: "{{ aws_bin }} sts get-caller-identity"
      environment: "{{ aws_env }}"
      register: aws_identity
      changed_when: false

    - name: Abort if AWS identity check failed (non-check mode)
      when: not ansible_check_mode
      ansible.builtin.assert:
        that: aws_identity.rc == 0
        fail_msg: >-
          AWS credentials are not valid or not discoverable by the CLI.
          Ensure keys/profile are correct or set aws_auth_from_file/use_aws_profile accordingly.

    # ------------------------- ROSA TOKEN LOGIN ------------------------------
    - name: Check for offline token file in /tmp
      ansible.builtin.stat:
        path: "{{ token_file }}"
      register: token_stat
      check_mode: no

    - name: Load offline token from /tmp (preferred)
      when: token_stat.stat.exists
      ansible.builtin.set_fact:
        ocm_token: "{{ lookup('file', token_file) | trim }}"

    - name: Fallback to OCM_TOKEN environment variable
      when: not token_stat.stat.exists
      ansible.builtin.set_fact:
        ocm_token: "{{ lookup('env', 'OCM_TOKEN') | trim }}"

    - name: Assert a token is available for ROSA login
      ansible.builtin.assert:
        that:
          - ocm_token is defined
          - ocm_token | length > 0
        fail_msg: "No offline token found. Put it in {{ token_file }} or export OCM_TOKEN."

    - name: Log in to ROSA/OCM with offline token (non-interactive)
      ansible.builtin.command: >
        {{ rosa_bin }} login --token "{{ ocm_token }}"
      environment: "{{ aws_env }}"
      register: rosa_login
      changed_when: "'Logged in' in rosa_login.stdout or rosa_login.rc == 0"
      check_mode: no

    ###########################################################################
    # ----------------------------- GUARDRAILS --------------------------------
    ###########################################################################
    - name: Compute minimum replicas required based on topology
      ansible.builtin.set_fact:
        min_replicas_required: "{{ 3 if multi_az else 2 }}"

    - name: Enforce minimum replicas (fail fast with guidance)
      ansible.builtin.assert:
        that:
          - (compute_replicas | int) >= (min_replicas_required | int)
        fail_msg: >-
          Invalid worker count for the selected topology.
          Mode={{ 'HCP' if hosted_control_plane else 'Classic' }}, multi_AZ={{ multi_az }}.
          Provided replicas={{ compute_replicas }}, but minimum required is {{ min_replicas_required }}.
          Action: increase 'compute_replicas' to at least {{ min_replicas_required }}.

    - name: Validate availability_zones count if provided
      when: availability_zones | length > 0
      ansible.builtin.assert:
        that:
          - (availability_zones | length) >= 2 if multi_az else (availability_zones | length) == 1
        fail_msg: >-
          availability_zones does not match topology.
          multi_AZ={{ multi_az }} requires {{ '>= 2 AZs' if multi_az else 'exactly 1 AZ' }},
          but you provided {{ availability_zones | length }}: {{ availability_zones }}.

  ###########################################################################
  # ------------------------------ TASKS ------------------------------------
  ###########################################################################
  tasks:
    # ===================== OCM/Account Prereqs (idempotent) =================
    - name: Create OCM admin role if none exists (safe to re-run)
      ansible.builtin.command: >
        {{ rosa_bin }} create ocm-role --admin
      register: create_ocm_admin_role
      changed_when: "'created' in (create_ocm_admin_role.stdout | lower)"
      failed_when: create_ocm_admin_role.rc not in [0]
      environment: "{{ aws_env }}"

    - name: Create user role (safe to re-run)
      ansible.builtin.command: >
        {{ rosa_bin }} create user-role
      register: create_user_role
      changed_when: "'created' in (create_user_role.stdout | lower)"
      failed_when: create_user_role.rc not in [0]
      environment: "{{ aws_env }}"

    - name: Create account-wide roles and policies (auto mode; idempotent)
      ansible.builtin.command: >
        {{ rosa_bin }} create account-roles --mode auto --yes --region {{ aws_region }}
      register: create_account_roles
      changed_when: "'created' in (create_account_roles.stdout | lower)"
      failed_when: create_account_roles.rc not in [0]
      environment: "{{ aws_env }}"

    - name: Optionally link an existing OCM role to your RH org
      when: ocm_role_arn_to_link | length > 0
      ansible.builtin.command: >
        {{ rosa_bin }} link ocm-role {{ ocm_role_arn_to_link }}
      register: link_ocm_role
      changed_when: "'linked' in (link_ocm_role.stdout | lower)"
      failed_when: link_ocm_role.rc not in [0]
      environment: "{{ aws_env }}"

    # ========================= Optional Network Creation =====================
    - name: Conditionally create a VPC for the cluster
      when: create_vpc | bool
      block:
        - name: Create VPC via 'rosa create network' (idempotent)
          ansible.builtin.command: >
            {{ rosa_bin }} create network
            --yes
            --region {{ aws_region }}
            --stack-name {{ vpc_stack_name }}
          register: rosa_network
          changed_when: "'created' in (rosa_network.stdout | lower)"
          failed_when: rosa_network.rc not in [0]
          environment: "{{ aws_env }}"

        - name: Describe VPC to get subnet IDs
          ansible.builtin.command: >
            {{ rosa_bin }} describe network --stack-name {{ vpc_stack_name }} -o json
          register: rosa_network_desc
          changed_when: false
          check_mode: no
          environment: "{{ aws_env }}"

        - name: Save subnet_ids from network stack outputs
          ansible.builtin.set_fact:
            subnet_ids: "{{ (rosa_network_desc.stdout | default('{}') | from_json).subnet_ids | default(subnet_ids) }}"

    # ============================ Cluster Creation ===========================
    - name: Check if the cluster already exists
      ansible.builtin.command: "{{ rosa_bin }} describe cluster -c {{ cluster_name }} -o json"
      register: existing_cluster
      changed_when: false
      failed_when: false
      check_mode: no
      environment: "{{ aws_env }}"

    - name: Build base cluster create command (shared flags)
      ansible.builtin.set_fact:
        _cluster_cmd_base: >-
          {{ rosa_bin }} create cluster
          --cluster-name {{ cluster_name }}
          --sts
          --mode auto
          --yes
          --region {{ aws_region }}
          --tags "{{ tags }}"
          --compute-machine-type {{ compute_machine_type }}
          --replicas {{ compute_replicas }}
          {% if private %} --private {% endif %}
          {% if multi_az %} --multi-az {% endif %}
          {% if availability_zones|length > 0 %} --availability-zones {{ availability_zones | join(',') }} {% endif %}
          {% if subnet_ids|length > 0 %} --subnet-ids {{ subnet_ids | join(',') }} {% endif %}
          {% if openshift_version|length > 0 %} --version {{ openshift_version }} {% endif %}

    - name: Derive final cluster create command for selected mode
      ansible.builtin.set_fact:
        create_cluster_cmd: >-
          {{ _cluster_cmd_base }}{% if hosted_control_plane %} --hosted-cp{% endif %}

    - name: Create the cluster if it does not exist yet
      when: existing_cluster.rc != 0
      ansible.builtin.command: "{{ create_cluster_cmd }}"
      register: create_cluster
      changed_when: true
      failed_when: create_cluster.rc not in [0]
      environment: "{{ aws_env }}"

    # =================== Cluster-Scoped IAM (idempotent safety) =============
    - name: Ensure cluster operator-roles exist (auto)
      ansible.builtin.command: >
        {{ rosa_bin }} create operator-roles -c {{ cluster_name }} --mode auto --yes
      register: create_operator_roles
      changed_when: "'created' in (create_operator_roles.stdout | lower)"
      failed_when: create_operator_roles.rc not in [0]
      environment: "{{ aws_env }}"

    - name: Ensure cluster OIDC provider exists (auto)
      ansible.builtin.command: >
        {{ rosa_bin }} create oidc-provider -c {{ cluster_name }} --mode auto --yes
      register: create_oidc_provider
      changed_when: "'created' in (create_oidc_provider.stdout | lower)"
      failed_when: create_oidc_provider.rc not in [0]
      environment: "{{ aws_env }}"

    # ============================ Wait for Ready =============================
    - name: Watch install logs until cluster is ready (async)
      when: not ansible_check_mode
      vars:
        watch_seconds: "{{ (cluster_ready_timeout_m | int) * 60 }}"
      ansible.builtin.command: >
        {{ rosa_bin }} logs install -c {{ cluster_name }} --watch --tail=100
      register: install_watch
      changed_when: false
      failed_when: false
      async: "{{ watch_seconds }}"
      poll: 15
      environment: "{{ aws_env }}"

    - name: Describe cluster to verify status
      when: not ansible_check_mode
      ansible.builtin.command: "{{ rosa_bin }} describe cluster -c {{ cluster_name }} -o json"
      register: cluster_desc
      changed_when: false
      failed_when: cluster_desc.rc != 0
      check_mode: no
      environment: "{{ aws_env }}"

    - name: Parse cluster JSON (only when we have output)
      when: not ansible_check_mode and (cluster_desc.stdout | default('') | length > 0)
      ansible.builtin.set_fact:
        cluster_json: "{{ cluster_desc.stdout | from_json }}"

    - name: Fail if cluster did not reach 'ready' in time
      when: not ansible_check_mode and (cluster_json is defined)
      ansible.builtin.assert:
        that:
          - "(cluster_json.state | lower) == 'ready'"
        fail_msg: "Cluster {{ cluster_name }} did not reach 'ready' within {{ cluster_ready_timeout_m }} minutes."

    # ============================ Post-Install ===============================
    - name: Create one-time cluster-admin user for initial access
      when: not ansible_check_mode
      ansible.builtin.command: "{{ rosa_bin }} create admin -c {{ cluster_name }} --yes"
      register: create_admin
      changed_when: "'created' in (create_admin.stdout | lower) or 'generated' in (create_admin.stdout | lower)"
      failed_when: create_admin.rc not in [0]
      environment: "{{ aws_env }}"

    - name: Save cluster-admin credentials to /tmp (0600)
      when: not ansible_check_mode and (create_admin is defined)
      ansible.builtin.copy:
        dest: "{{ admin_creds_file }}"
        mode: "0600"
        content: "{{ create_admin.stdout }}"

    - name: Stash admin credentials text for final summary
      when: not ansible_check_mode and (create_admin is defined)
      ansible.builtin.set_fact:
        admin_creds_text: "{{ create_admin.stdout }}"

    - name: Extract API URL for convenience
      when: not ansible_check_mode and (cluster_json is defined)
      ansible.builtin.set_fact:
        api_url: "{{ cluster_json.api.url }}"

    - name: Final summary
      ansible.builtin.debug:
        msg:
          - "Mode: {{ 'Hosted Control Plane (HCP)' if hosted_control_plane else 'Classic (non-HCP)' }}"
          - "AZ topology: {{ 'multi-AZ' if multi_az else 'single-AZ' }}"
          - "Replicas: {{ compute_replicas }} (min required: {{ min_replicas_required }})"
          - >-
            {% if ansible_check_mode %}
            --check mode: identity/readiness/admin steps skipped.
            {% else %}
            {% if api_url is defined %}API: {{ api_url }}{% else %}API URL not parsed.{% endif %}
            Admin creds file (sensitive): {{ admin_creds_file }}
            {% if print_admin_creds and (admin_creds_text is defined) %}
            ---- Cluster Admin Credentials (sensitive) ----
            {{ admin_creds_text }}
            -----------------------------------------------
            {% endif %}
            {% endif %}
