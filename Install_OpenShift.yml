---
- name: "Provision ROSA (Classic by default; HCP when requested)"
  hosts: localhost
  connection: local
  gather_facts: false

  environment:
    AWS_REGION: "{{ aws_region }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
    AWS_PAGER: ""

  vars:
    # ===== Cluster mode / naming =====
    hosted_control_plane: false
    aws_region: "us-east-1"
    cluster_name: "rosa-demo-classic"

    # ===== OpenShift version =====
    openshift_version: ""

    # ===== Topology / sizing =====
    multi_az: true
    private: false
    compute_machine_type: "m5.xlarge"
    compute_replicas: 3
    availability_zones: []

    # ===== Tagging =====
    tags: "owner=iam,env=dev"

    # ===== Network =====
    subnet_ids: []
    create_vpc: false
    vpc_stack_name: "rosa-vpc-{{ cluster_name }}"

    # ===== Role/link options =====
    ocm_role_arn_to_link: ""

    # ===== Auth files under /tmp (inside EE; host ./secrets is bind-mounted to /tmp) =====
    token_file: "/tmp/ocm_offline_token.txt"
    aws_auth_from_file: true
    aws_credentials_file: "/tmp/aws_credentials.txt"     # INI or ENV format accepted
    aws_profile: ""                                       # set to an INI section like "ocp" if desired

    # Optional helper file to mirror into .aws dirs
    aws_profile_txt_src: "/tmp/aws-profile.txt"
    tmp_aws_dir: "/tmp/.aws"
    tmp_profile_txt_dest: "{{ tmp_aws_dir }}/aws-profile.txt"

    # ===== Where the EE writes AWS CLI config/credentials =====
    aws_cli_home: "/tmp/awscli-{{ cluster_name }}"
    aws_credentials_out: "{{ aws_cli_home }}/credentials"
    aws_config_out: "{{ aws_cli_home }}/config"
    aws_output: "json"

    using_ansible_navigator: false
    runner_aws_dir: "/runner/.aws"
    runner_credentials_out: "{{ runner_aws_dir }}/credentials"
    runner_config_out: "{{ runner_aws_dir }}/config"
    runner_profile_txt_dest: "{{ runner_aws_dir }}/aws-profile.txt"

    workdir: "./artifacts/{{ cluster_name }}"
    admin_creds_file: "/tmp/cluster-admin-{{ cluster_name }}.txt"

    # Waits
    cluster_ready_timeout_m: 150
    wait_poll_seconds: 60
    logs_tail: 200
    logs_poll_seconds: 20

    print_admin_creds: true

    # Binaries
    rosa_bin: "rosa"
    aws_bin: "aws"
    oc_bin: "oc"
    jq_bin: "jq"

  pre_tasks:
    - name: "Create artifacts directory (for non-secret logs/outputs)"
      ansible.builtin.file:
        path: "{{ workdir }}"
        state: directory
        mode: "0750"
      tags: [always, setup]

    - name: "Verify required CLIs are installed"
      block:
        - name: "which (rosa/aws/oc/jq)"
          ansible.builtin.command: "which {{ item }}"
          loop:
            - "{{ rosa_bin }}"
            - "{{ aws_bin }}"
            - "{{ oc_bin }}"
            - "{{ jq_bin }}"
          register: which_out
          changed_when: false
          check_mode: no
        - name: "Fail if any CLI is missing"
          ansible.builtin.assert:
            that: "{{ which_out.results | map(attribute='rc') | list | max == 0 }}"
            fail_msg: "Missing required CLI (rosa/aws/oc/jq) on control host."
      tags: [always, setup]

    # ------------------------- AWS CREDENTIALS SETUP (HARDENED) -------------------------
    - name: "Stat AWS credentials file in /tmp (if enabled)"
      when: aws_auth_from_file | bool
      ansible.builtin.stat:
        path: "{{ aws_credentials_file }}"
      register: aws_file_stat
      check_mode: no
      tags: [aws_auth]

    - name: "Read AWS credentials file content from /tmp"
      when: aws_auth_from_file | bool and aws_file_stat.stat.exists
      ansible.builtin.set_fact:
        aws_file_content: "{{ lookup('file', aws_credentials_file) }}"
      tags: [aws_auth]

    - name: "Discover sections and ENV AWS_PROFILE (if present)"
      when: aws_file_content is defined
      ansible.builtin.set_fact:
        _sections_list: "{{ aws_file_content | regex_findall('(?m)^\\s*\\[([^\\]]+)\\]\\s*$') }}"
        _env_profile_raw: "{{ (aws_file_content | regex_findall('(?mi)^\\s*AWS_PROFILE\\s*=\\s*(.+)$') | first | default('')) | trim }}"
      tags: [aws_auth]

    - name: "Sanitize provided and discovered profiles"
      ansible.builtin.set_fact:
        _aws_profile_arg: "{{ (aws_profile | default('') | string | trim) }}"
        _env_profile_clean: "{{ '' if (_env_profile_raw | lower) in ['none','null'] else _env_profile_raw }}"
        _first_section: "{{ _sections_list | first | default('') }}"
      tags: [aws_auth]

    - name: "Choose effective AWS profile"
      ansible.builtin.set_fact:
        effective_aws_profile: >-
          {{
            (_aws_profile_arg if _aws_profile_arg|length>0
             else (_env_profile_clean if _env_profile_clean|length>0
             else (_first_section if _first_section|length>0
             else 'default')))
          }}
      tags: [aws_auth]

    - name: "Parse ENV-style credentials (candidate)"
      when: aws_file_content is defined
      ansible.builtin.set_fact:
        _env_aki: "{{ (aws_file_content | regex_findall('(?mi)^\\s*AWS_ACCESS_KEY_ID\\s*=\\s*(.+)$') | first | default('')) | trim }}"
        _env_sak: "{{ (aws_file_content | regex_findall('(?mi)^\\s*AWS_SECRET_ACCESS_KEY\\s*=\\s*(.+)$') | first | default('')) | trim }}"
        _env_tok: "{{ (aws_file_content | regex_findall('(?mi)^\\s*AWS_SESSION_TOKEN\\s*=\\s*(.+)$') | first | default('')) | trim }}"
      tags: [aws_auth]

    - name: "Parse INI-style credentials (candidate, from chosen profile)"
      when: aws_file_content is defined
      vars:
        _sec: "{{ effective_aws_profile }}"
      ansible.builtin.set_fact:
        _ini_aki: "{{ (lookup('ini', 'aws_access_key_id section=' ~ _sec ~ ' file=' ~ aws_credentials_file) | default('')) | trim }}"
        _ini_sak: "{{ (lookup('ini', 'aws_secret_access_key section=' ~ _sec ~ ' file=' ~ aws_credentials_file) | default('')) | trim }}"
        _ini_tok: "{{ (lookup('ini', 'aws_session_token section=' ~ _sec ~ ' file=' ~ aws_credentials_file) | default('')) | trim }}"
      tags: [aws_auth]

    - name: "Select final AWS creds (prefer INI over ENV)"
      ansible.builtin.set_fact:
        aws_access_key_id: "{{ ( _ini_aki if (_ini_aki | length > 0) else _env_aki ) | trim }}"
        aws_secret_access_key: "{{ ( _ini_sak if (_ini_sak | length > 0) else _env_sak ) | trim }}"
        aws_session_token: "{{ ( _ini_tok if (_ini_tok | length > 0) else _env_tok ) | trim }}"
      tags: [aws_auth]

    - name: "Normalize 'none'/'null' to empty values"
      ansible.builtin.set_fact:
        aws_access_key_id: "{{ '' if (aws_access_key_id | lower) in ['none','null',''] else aws_access_key_id }}"
        aws_secret_access_key: "{{ '' if (aws_secret_access_key | lower) in ['none','null',''] else aws_secret_access_key }}"
        aws_session_token: "{{ '' if (aws_session_token | lower) in ['none','null'] else aws_session_token }}"
      tags: [aws_auth]

    - name: "Debug parsed credentials (masked)"
      when: (ansible_verbosity | int) > 0
      ansible.builtin.debug:
        msg:
          - "Effective profile: {{ effective_aws_profile }}"
          - "Key present: {{ 'yes' if (aws_access_key_id | length > 0) else 'no' }}"
          - "Secret present: {{ 'yes' if (aws_secret_access_key | length > 0) else 'no' }}"
          - "Token present: {{ 'yes' if (aws_session_token | length > 0) else 'no' }}"
          - "INI sections found: {{ _sections_list | default([]) }}"
      tags: [aws_auth]

    - name: "Assert AWS keys present when aws_auth_from_file=true"
      when: aws_auth_from_file | bool
      ansible.builtin.assert:
        that:
          - aws_access_key_id | length > 0
          - aws_secret_access_key | length > 0
        fail_msg: >-
          aws_auth_from_file=true but {{ aws_credentials_file }} did not contain usable keys.
          Supported formats:
          1) INI:
             [{{ effective_aws_profile }}]
             aws_access_key_id = AKIA...
             aws_secret_access_key = ...
             # aws_session_token = ... (optional)
          2) ENV:
             AWS_ACCESS_KEY_ID=...
             AWS_SECRET_ACCESS_KEY=...
             # AWS_SESSION_TOKEN=... (optional)
      tags: [aws_auth]

    - name: "Create /tmp AWS CLI home directory"
      ansible.builtin.file:
        path: "{{ aws_cli_home }}"
        state: directory
        mode: "0700"
      tags: [aws_auth]

    - name: "Materialize AWS config/credentials via aws configure set"
      ansible.builtin.shell: |
        set -euo pipefail
        export AWS_CONFIG_FILE="{{ aws_config_out }}"
        export AWS_SHARED_CREDENTIALS_FILE="{{ aws_credentials_out }}"
        mkdir -p "$(dirname "$AWS_CONFIG_FILE")"
        mkdir -p "$(dirname "$AWS_SHARED_CREDENTIALS_FILE")"
        {{ aws_bin }} configure set region "{{ aws_region }}" --profile "{{ effective_aws_profile }}"
        {{ aws_bin }} configure set output "{{ aws_output }}" --profile "{{ effective_aws_profile }}"
        {{ aws_bin }} configure set aws_access_key_id "{{ aws_access_key_id }}" --profile "{{ effective_aws_profile }}"
        {{ aws_bin }} configure set aws_secret_access_key "{{ aws_secret_access_key }}" --profile "{{ effective_aws_profile }}"
        {% if aws_session_token | length > 0 %}
        {{ aws_bin }} configure set aws_session_token "{{ aws_session_token }}" --profile "{{ effective_aws_profile }}"
        {% endif %}
      args:
        executable: /bin/bash
      changed_when: false
      tags: [aws_auth]

    - name: "Create /runner/.aws when using_ansible_navigator"
      when: using_ansible_navigator | bool
      ansible.builtin.file:
        path: "{{ runner_aws_dir }}"
        state: directory
        mode: "0700"
      check_mode: no
      tags: [aws_auth]

    - name: "Create /tmp/.aws directory (0700)"
      ansible.builtin.file:
        path: "{{ tmp_aws_dir }}"
        state: directory
        mode: "0700"
      check_mode: no
      tags: [aws_auth]

    - name: "Stat /tmp/aws-profile.txt"
      ansible.builtin.stat:
        path: "{{ aws_profile_txt_src }}"
      register: aws_profile_txt_stat
      check_mode: no
      tags: [aws_auth]

    - name: "Copy aws-profile.txt into /tmp/.aws/"
      when: aws_profile_txt_stat.stat.exists
      ansible.builtin.copy:
        src: "{{ aws_profile_txt_src }}"
        dest: "{{ tmp_profile_txt_dest }}"
        mode: "0600"
        remote_src: true
      tags: [aws_auth]

    - name: "Mirror credentials/config to /runner/.aws (navigator)"
      when: using_ansible_navigator | bool
      block:
        - name: "Mirror credentials to /runner/.aws/credentials"
          ansible.builtin.copy:
            dest: "{{ runner_credentials_out }}"
            mode: "0600"
            content: |-
              [{{ effective_aws_profile }}]
              aws_access_key_id={{ aws_access_key_id }}
              aws_secret_access_key={{ aws_secret_access_key }}{% if aws_session_token | length > 0 %}
              aws_session_token={{ aws_session_token }}{% endif %}
        - name: "Mirror config to /runner/.aws/config"
          ansible.builtin.copy:
            dest: "{{ runner_config_out }}"
            mode: "0600"
            content: |-
              [profile {{ effective_aws_profile }}]
              region = {{ aws_region }}
              output = {{ aws_output }}
      tags: [aws_auth]

    - name: "Initialize file-based AWS env (base)"
      ansible.builtin.set_fact:
        aws_env_files:
          AWS_REGION: "{{ aws_region }}"
          AWS_DEFAULT_REGION: "{{ aws_region }}"
          AWS_PAGER: ""
          AWS_SHARED_CREDENTIALS_FILE: "{{ aws_credentials_out }}"
          AWS_CONFIG_FILE: "{{ aws_config_out }}"
          AWS_PROFILE: "{{ effective_aws_profile }}"
      tags: [aws_auth]

    - name: "Initialize DIRECT env (keys directly) if keys present"
      ansible.builtin.set_fact:
        aws_env_direct: >-
          {{
            {
              'AWS_REGION': aws_region,
              'AWS_DEFAULT_REGION': aws_region,
              'AWS_PAGER': '',
              'AWS_ACCESS_KEY_ID': aws_access_key_id,
              'AWS_SECRET_ACCESS_KEY': aws_secret_access_key
            }
            | combine( {'AWS_SESSION_TOKEN': aws_session_token}, recursive=True )
            if (aws_access_key_id | length > 0 and aws_secret_access_key | length > 0)
            else {}
          }}
      tags: [aws_auth]

    - name: "Initialize HOST env (fallback)"
      ansible.builtin.set_fact:
        aws_env_host:
          AWS_REGION: "{{ aws_region }}"
          AWS_DEFAULT_REGION: "{{ aws_region }}"
          AWS_PAGER: ""
      tags: [aws_auth]

    - name: "Try AWS identity: DIRECT env (skipped in --check)"
      when: not ansible_check_mode and (aws_env_direct | length > 0)
      ansible.builtin.command: "{{ aws_bin }} sts get-caller-identity"
      environment: "{{ aws_env_direct }}"
      register: aws_id_direct
      changed_when: false
      failed_when: false
      tags: [aws_auth]

    - name: "Try AWS identity: FILE env with explicit --profile (skipped in --check)"
      when: not ansible_check_mode and ((aws_id_direct is not defined) or (aws_id_direct.rc != 0))
      ansible.builtin.command: "{{ aws_bin }} sts get-caller-identity --profile {{ effective_aws_profile }}"
      environment: "{{ aws_env_files }}"
      register: aws_id_files
      changed_when: false
      failed_when: false
      tags: [aws_auth]

    - name: "Try AWS identity: HOST env (last resort) (skipped in --check)"
      when: not ansible_check_mode and (
              (aws_id_direct is not defined or aws_id_direct.rc != 0) and
              (aws_id_files is not defined or aws_id_files.rc != 0)
            )
      ansible.builtin.command: "{{ aws_bin }} sts get-caller-identity"
      environment: "{{ aws_env_host }}"
      register: aws_id_host
      changed_when: false
      failed_when: false
      tags: [aws_auth]

    - name: "Pick the first successful AWS env (or none)"
      when: not ansible_check_mode
      ansible.builtin.set_fact:
        aws_env: >-
          {{
            (aws_env_direct if (aws_id_direct is defined and aws_id_direct.rc == 0)
             else (aws_env_files if (aws_id_files is defined and aws_id_files.rc == 0)
             else (aws_env_host if (aws_id_host is defined and aws_id_host.rc == 0)
             else omit)))
          }}
        aws_env_source: >-
          {{
            ('direct' if (aws_id_direct is defined and aws_id_direct.rc == 0)
             else ('files' if (aws_id_files is defined and aws_id_files.rc == 0)
             else ('host' if (aws_id_host is defined and aws_id_host.rc == 0)
             else 'none')))
          }}
      tags: [aws_auth]

    # ---- SAFE error strings for AWS auth attempts (avoid attribute errors) ----
    - name: "Compute DIRECT attempt message"
      when: not ansible_check_mode
      ansible.builtin.set_fact:
        _aws_err_direct: >-
          {{
            (aws_id_direct is defined)
            | ternary(
                (aws_id_direct.stderr | default(aws_id_direct.stdout | default('n/a')) | string | trim),
                'n/a'
              )
          }}
      tags: [aws_auth]

    - name: "Compute FILES attempt message"
      when: not ansible_check_mode
      ansible.builtin.set_fact:
        _aws_err_files: >-
          {{
            (aws_id_files is defined)
            | ternary(
                (aws_id_files.stderr | default(aws_id_files.stdout | default('n/a')) | string | trim),
                'n/a'
              )
          }}
      tags: [aws_auth]

    - name: "Compute HOST attempt message"
      when: not ansible_check_mode
      ansible.builtin.set_fact:
        _aws_err_host: >-
          {{
            (aws_id_host is defined)
            | ternary(
                (aws_id_host.stderr | default(aws_id_host.stdout | default('n/a')) | string | trim),
                'n/a'
              )
          }}
      tags: [aws_auth]

    - name: "Abort if no AWS auth method worked (non-check mode)"
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - aws_env is defined
        fail_msg: |-
          No working AWS authentication method found.
          Tried DIRECT env, file-based (/tmp/awscli-{{ cluster_name }} profile={{ effective_aws_profile }}), then host env.
          Last errors:
          DIRECT: {{ _aws_err_direct }}
          FILES: {{ _aws_err_files }}
          HOST:  {{ _aws_err_host }}
      tags: [aws_auth]

    # ------------------------- ROSA TOKEN LOGIN ------------------------------
    - name: "Check for offline token file in /tmp"
      ansible.builtin.stat:
        path: "{{ token_file }}"
      register: token_stat
      check_mode: no
      tags: [rosa_auth]

    - name: "Load offline token from /tmp (preferred)"
      when: token_stat.stat.exists
      ansible.builtin.set_fact:
        ocm_token: "{{ lookup('file', token_file) | trim }}"
      tags: [rosa_auth]

    - name: "Fallback to OCM_TOKEN environment variable"
      when: not token_stat.stat.exists
      ansible.builtin.set_fact:
        ocm_token: "{{ lookup('env', 'OCM_TOKEN') | trim }}"
      tags: [rosa_auth]

    - name: "Assert a token is available for ROSA login"
      ansible.builtin.assert:
        that:
          - ocm_token is defined
          - ocm_token | length > 0
        fail_msg: "No offline token found. Put it in {{ token_file }} or export OCM_TOKEN."
      tags: [rosa_auth]

    - name: "Log in to ROSA/OCM with offline token (non-interactive)"
      ansible.builtin.command: >
        {{ rosa_bin }} login --token "{{ ocm_token }}"
      environment: "{{ aws_env | default(aws_env_files) }}"
      register: rosa_login
      changed_when: "'Logged in' in rosa_login.stdout or rosa_login.rc == 0"
      check_mode: no
      tags: [rosa_auth]

    # ----------------------------- GUARDRAILS --------------------------------
    - name: "Compute minimum replicas required based on topology"
      ansible.builtin.set_fact:
        min_replicas_required: "{{ 3 if multi_az else 2 }}"
      tags: [guardrails]

    - name: "Enforce minimum replicas (fail fast with guidance)"
      ansible.builtin.assert:
        that:
          - (compute_replicas | int) >= (min_replicas_required | int)
        fail_msg: "Invalid 'compute_replicas' for topology; need >= {{ min_replicas_required }}."
      tags: [guardrails]

    - name: "Validate availability_zones count if provided"
      when: availability_zones | length > 0
      ansible.builtin.assert:
        that:
          - (availability_zones | length) >= 2 if multi_az else (availability_zones | length) == 1
        fail_msg: "availability_zones does not match topology."
      tags: [guardrails]

  tasks:
    # ===================== OCM/Account Prereqs (idempotent) =================
    - name: "Create OCM admin role if none exists (safe to re-run)"
      ansible.builtin.command: >
        {{ rosa_bin }} create ocm-role --admin
      register: create_ocm_admin_role
      changed_when: "'created' in (create_ocm_admin_role.stdout | lower)"
      failed_when: create_ocm_admin_role.rc not in [0]
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [prereqs]

    - name: "Create user role (safe to re-run)"
      ansible.builtin.command: >
        {{ rosa_bin }} create user-role
      register: create_user_role
      changed_when: "'created' in (create_user_role.stdout | lower)"
      failed_when: create_user_role.rc not in [0]
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [prereqs]

    - name: "Create account-wide roles and policies (auto mode; idempotent)"
      ansible.builtin.command: >
        {{ rosa_bin }} create account-roles --mode auto --yes --region {{ aws_region }}
      register: create_account_roles
      changed_when: "'created' in (create_account_roles.stdout | lower)"
      failed_when: create_account_roles.rc not in [0]
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [prereqs]

    - name: "Optionally link an existing OCM role to your RH org"
      when: ocm_role_arn_to_link | length > 0
      ansible.builtin.command: >
        {{ rosa_bin }} link ocm-role {{ ocm_role_arn_to_link }}
      register: link_ocm_role
      changed_when: "'linked' in (link_ocm_role.stdout | lower)"
      failed_when: link_ocm_role.rc not in [0]
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [prereqs]

    # ========================= Optional Network Creation =====================
    - name: "Conditionally create a VPC for the cluster"
      when: create_vpc | bool
      block:
        - name: "Create VPC via 'rosa create network' (idempotent)"
          ansible.builtin.command: >
            {{ rosa_bin }} create network
            --yes
            --region {{ aws_region }}
            --stack-name {{ vpc_stack_name }}
          register: rosa_network
          changed_when: "'created' in (rosa_network.stdout | lower)"
          failed_when: rosa_network.rc not in [0]
          environment: "{{ aws_env | default(aws_env_files) }}"
          tags: [network]

        - name: "Describe VPC to get subnet IDs"
          ansible.builtin.command: >
            {{ rosa_bin }} describe network --stack-name {{ vpc_stack_name }} -o json
          register: rosa_network_desc
          changed_when: false
          check_mode: no
          environment: "{{ aws_env | default(aws_env_files) }}"
          tags: [network]

        - name: "Save subnet_ids from network stack outputs"
          ansible.builtin.set_fact:
            subnet_ids: "{{ (rosa_network_desc.stdout | default('{}') | from_json).subnet_ids | default(subnet_ids) }}"
          tags: [network]

    # ============================ Cluster Creation ===========================
    - name: "Check if the cluster already exists"
      ansible.builtin.command: "{{ rosa_bin }} describe cluster -c {{ cluster_name }} -o json"
      register: existing_cluster
      changed_when: false
      failed_when: false
      check_mode: no
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [cluster_create]

    - name: "Build base cluster create command (shared flags)"
      ansible.builtin.set_fact:
        _cluster_cmd_base: >-
          {{ rosa_bin }} create cluster
          --cluster-name {{ cluster_name }}
          --sts
          --mode auto
          --yes
          --region {{ aws_region }}
          --tags "{{ tags }}"
          --compute-machine-type {{ compute_machine_type }}
          --replicas {{ compute_replicas }}
          {% if private %} --private {% endif %}
          {% if multi_az %} --multi-az {% endif %}
          {% if availability_zones|length > 0 %} --availability-zones {{ availability_zones | join(',') }} {% endif %}
          {% if subnet_ids|length > 0 %} --subnet-ids {{ subnet_ids | join(',') }} {% endif %}
          {% if openshift_version|length > 0 %} --version {{ openshift_version }} {% endif %}
      tags: [cluster_create]

    - name: "Derive final cluster create command for selected mode"
      ansible.builtin.set_fact:
        create_cluster_cmd: >-
          {{ _cluster_cmd_base }}{% if hosted_control_plane %} --hosted-cp{% endif %}
      tags: [cluster_create]

    - name: "Create the cluster if it does not exist yet"
      when: existing_cluster.rc != 0
      ansible.builtin.command: "{{ create_cluster_cmd }}"
      register: create_cluster
      changed_when: true
      failed_when: create_cluster.rc not in [0]
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [cluster_create]

    # =================== Cluster-Scoped IAM (idempotent safety) =============
    - name: "Ensure cluster operator-roles exist (auto)"
      ansible.builtin.command: >
        {{ rosa_bin }} create operator-roles -c {{ cluster_name }} --mode auto --yes
      register: create_operator_roles
      changed_when: "'created' in (create_operator_roles.stdout | lower)"
      failed_when: create_operator_roles.rc not in [0]
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [operator_roles]

    - name: "Ensure cluster OIDC provider exists (auto)"
      ansible.builtin.command: >
        {{ rosa_bin }} create oidc-provider -c {{ cluster_name }} --mode auto --yes
      register: create_oidc_provider
      changed_when: "'created' in (create_oidc_provider.stdout | lower)"
      failed_when: create_oidc_provider.rc not in [0]
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [oidc]

    # ============================ Wait for Ready =============================
    - name: "Compute waiter retries from timeout+interval"
      ansible.builtin.set_fact:
        wait_retries: "{{ ((cluster_ready_timeout_m | int) * 60 // (wait_poll_seconds | int)) | int }}"
      tags: [wait_ready]

    - name: "Watch install logs until cluster is ready (async)"
      when: not ansible_check_mode
      vars:
        watch_seconds: "{{ (cluster_ready_timeout_m | int) * 60 }}"
      ansible.builtin.command: >
        {{ rosa_bin }} logs install -c {{ cluster_name }} --watch --tail={{ logs_tail }}
      register: install_watch
      changed_when: false
      failed_when: false
      async: "{{ watch_seconds }}"
      poll: "{{ logs_poll_seconds }}"
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [wait_ready]

    - name: "Wait until cluster state is 'ready'"
      when: not ansible_check_mode
      ansible.builtin.command: "{{ rosa_bin }} describe cluster -c {{ cluster_name }} -o json"
      register: cluster_desc_wait
      changed_when: false
      failed_when: false
      retries: "{{ wait_retries }}"
      delay: "{{ wait_poll_seconds }}"
      until: >
        (cluster_desc_wait.stdout is defined) and
        (cluster_desc_wait.stdout | length > 0) and
        ((cluster_desc_wait.stdout | from_json).state | lower == 'ready')
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [wait_ready]

    - name: "Final describe (parse for summary)"
      when: not ansible_check_mode
      ansible.builtin.command: "{{ rosa_bin }} describe cluster -c {{ cluster_name }} -o json"
      register: cluster_desc
      changed_when: false
      failed_when: cluster_desc.rc != 0
      check_mode: no
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [wait_ready]

    - name: "Parse cluster JSON (only when we have output)"
      when: not ansible_check_mode and (cluster_desc.stdout | default('') | length > 0)
      ansible.builtin.set_fact:
        cluster_json: "{{ cluster_desc.stdout | from_json }}"
      tags: [wait_ready]

    # ============================ Post-Install ===============================
    - name: "Create one-time cluster-admin user for initial access"
      when: not ansible_check_mode
      ansible.builtin.command: "{{ rosa_bin }} create admin -c {{ cluster_name }} --yes"
      register: create_admin
      changed_when: "'created' in (create_admin.stdout | lower) or 'generated' in (create_admin.stdout | lower)"
      failed_when: create_admin.rc not in [0]
      environment: "{{ aws_env | default(aws_env_files) }}"
      tags: [admin_user]

    - name: "Save cluster-admin credentials to /tmp (0600)"
      when: not ansible_check_mode and (create_admin is defined)
      ansible.builtin.copy:
        dest: "{{ admin_creds_file }}"
        mode: "0600"
        content: "{{ create_admin.stdout }}"
      tags: [admin_user]

    - name: "Stash admin credentials text for final summary"
      when: not ansible_check_mode and (create_admin is defined)
      ansible.builtin.set_fact:
        admin_creds_text: "{{ create_admin.stdout }}"
      tags: [admin_user]

    - name: "Extract API URL for convenience"
      when: not ansible_check_mode and (cluster_json is defined)
      ansible.builtin.set_fact:
        api_url: "{{ cluster_json.api.url }}"
      tags: [summary]

    - name: "Final summary"
      ansible.builtin.debug:
        msg:
          - "Mode: {{ 'Hosted Control Plane (HCP)' if hosted_control_plane else 'Classic (non-HCP)' }}"
          - "AZ topology: {{ 'multi-AZ' if multi_az else 'single-AZ' }}"
          - "Replicas: {{ compute_replicas }} (min required: {{ min_replicas_required }})"
          - >-
            {% if ansible_check_mode %}
            --check mode: identity/readiness/admin steps skipped.
            {% else %}
            {% if api_url is defined %}API: {{ api_url }}{% else %}API URL not parsed.{% endif %}
            Admin creds file (sensitive): {{ admin_creds_file }}
            {% if print_admin_creds and (admin_creds_text is defined) %}
            ---- Cluster Admin Credentials (sensitive) ----
            {{ admin_creds_text }}
            -----------------------------------------------
            {% endif %}
            {% endif %}
      tags: [summary]
